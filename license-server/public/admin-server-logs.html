<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTLock 管理 · 服务端日志</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body data-admin-page="server-logs">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span>G</span><div><strong>GPTLock</strong><small>Control Center</small></div></div>
    <nav><a href="/admin/overview" data-page="overview">总览</a><a href="/admin/users" data-page="users">用户</a><a href="/admin/plans" data-page="plans">会员</a><a href="/admin/orders" data-page="orders">订单</a><a href="/admin/settings" data-page="settings">系统配置</a><a href="/admin/client-logs" data-page="client-logs">客户端运行日志</a><a href="/admin/server-logs" data-page="server-logs" class="active" aria-current="page">服务端日志</a><a href="/admin/update" data-page="update">更新</a></nav>
    <button id="logout" class="ghost" hidden>退出管理员</button>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><p>GPTLOCK ADMIN · SERVER-LOGS</p><h1>服务端日志</h1></div><span class="security-pill">Account Control</span></header>
    <section id="login" class="card login-card">
      <h2>管理员登录</h2><p class="muted">后台仅使用独立管理员密码。建议通过 HTTPS + WAF / IP 白名单访问。</p>
      <div class="inline"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="loginButton" class="primary">登录</button></div>
      <p id="loginMessage" class="message"></p>
    </section>
    <div id="app" hidden>
      <section id="logs" class="card">
        <div class="section-title"><div><h2>服务端运行日志</h2><p class="muted">敏感密码、验证码、会话令牌不会写入运行日志。</p></div><div class="section-actions"><button id="refreshRuntime">刷新</button><button id="exportRuntime">导出</button></div></div>
        <pre id="runtimeLog" class="logbox">暂无日志</pre>
        <h3>账户审计</h3><pre id="audit" class="logbox">暂无审计</pre>
      </section>
    </div>
  </main>
</div>
<script type="module" src="/admin.js"></script>
</body>
</html>
