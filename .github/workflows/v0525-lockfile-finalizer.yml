name: v0.5.25 lockfile finalizer

on:
  push:
    branches:
      - test/automatic-update-v0525
    paths:
      - .github/workflows/v0525-lockfile-finalizer.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/automatic-update-v0525
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock for version-only release
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Verify version-only lockfile change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('native-core/Cargo.lock').read_text(encoding='utf-8')
          needle = 'name = "gptlock-core"\nversion = "0.5.25"'
          if needle not in text:
              raise SystemExit('Cargo.lock did not advance gptlock-core to 0.5.25')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "native-core/Cargo.lock"
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock
          git commit -m "test: refresh v0.5.25 lockfile"
          git push origin HEAD:test/automatic-update-v0525
