name: Release prep lockfile

on:
  push:
    branches:
      - release/v0.5.28-site-server

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.28-site-server
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh workspace package metadata in Cargo.lock
        run: cargo update --manifest-path native-core/Cargo.toml -w
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- native-core/Cargo.lock; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock
          git commit -m "release: refresh Cargo.lock for 0.5.28"
          git push origin HEAD:release/v0.5.28-site-server
