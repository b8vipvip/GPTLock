name: Apply v0.3.5 hotfix

on:
  push:
    branches:
      - codex/v0.3.5-auto-verify-retry-evidence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Repair patch applicator
        run: python tools/fix_apply_v035.py
      - name: Apply hotfix
        run: python tools/apply_v035_hotfix.py
      - name: Extension syntax and tests
        working-directory: extension
        run: npm test
      - name: Rust format
        run: cargo fmt --manifest-path native-core/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path native-core/Cargo.toml --all-targets
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-v035-hotfix.yml tools/apply_v035_hotfix.py tools/fix_apply_v035.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: retry incomplete auto verification with conversation evidence"
          git push origin HEAD:codex/v0.3.5-auto-verify-retry-evidence
