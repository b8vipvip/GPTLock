name: Temporary GPTWork Release Lock Refresh

on:
  push:
    branches:
      - refactor/gptwork-unified-brand-20260903

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh native core lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile --manifest-path native-core/Cargo.toml
          cargo metadata --locked --no-deps --manifest-path native-core/Cargo.toml >/dev/null
      - name: Commit lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: refresh GPTWork v0.5.36 Cargo.lock'
          git push origin HEAD:refactor/gptwork-unified-brand-20260903
