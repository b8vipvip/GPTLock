name: Temporary updater bootstrap capability fix

on:
  push:
    branches:
      - fix/updater-bootstrap-capability

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/updater-bootstrap-capability
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bootstrap capability patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'extension/update-manager.js',
              "export const UPDATE_STATUS_KEY = 'gptlockUiUpdateStatus';\n",
              "export const UPDATE_STATUS_KEY = 'gptlockUiUpdateStatus';\nexport const RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION = '0.5.6';\n",
          )
          replace_once(
              'extension/update-manager.js',
              "export function compareVersions(left, right) {\n  const leftParts = numericParts(left);\n  const rightParts = numericParts(right);\n  if (!leftParts || !rightParts) return null;\n  const length = Math.max(leftParts.length, rightParts.length);\n  for (let index = 0; index < length; index += 1) {\n    const leftValue = leftParts[index] ?? 0;\n    const rightValue = rightParts[index] ?? 0;\n    if (leftValue > rightValue) return 1;\n    if (leftValue < rightValue) return -1;\n  }\n  return 0;\n}\n",
              "export function compareVersions(left, right) {\n  const leftParts = numericParts(left);\n  const rightParts = numericParts(right);\n  if (!leftParts || !rightParts) return null;\n  const length = Math.max(leftParts.length, rightParts.length);\n  for (let index = 0; index < length; index += 1) {\n    const leftValue = leftParts[index] ?? 0;\n    const rightValue = rightParts[index] ?? 0;\n    if (leftValue > rightValue) return 1;\n    if (leftValue < rightValue) return -1;\n  }\n  return 0;\n}\n\nexport function supportsReliableWindowsOneClickUpdate(nativeVersion) {\n  const comparison = compareVersions(nativeVersion, RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION);\n  return comparison === 0 || comparison === 1;\n}\n",
          )

          replace_once(
              'extension/popup.js',
              "import {\n  compareVersions,\n  fetchLatestRelease,\n  WINDOWS_DOWNLOAD_FILENAME,\n} from './update-manager.js';\n",
              "import {\n  compareVersions,\n  fetchLatestRelease,\n  RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION,\n  supportsReliableWindowsOneClickUpdate,\n  WINDOWS_DOWNLOAD_FILENAME,\n} from './update-manager.js';\n",
          )
          replace_once(
              'extension/popup.js',
              "  if (release.updateAvailable) {\n    elements.updateDetail.textContent = `当前 ${currentVersion} · 最新 ${release.latestVersion} · ${platform?.os === 'win' ? '支持一键更新' : '当前系统请从发布页安装'}`;\n    elements.installUpdate.hidden = false;\n    elements.installUpdate.textContent = platform?.os === 'win' ? '立即更新' : '打开发布页';\n    return;\n  }\n",
              "  if (release.updateAvailable) {\n    const nativeVersion = lastState?.nativeStatus?.version ?? null;\n    const canOneClick = platform?.os === 'win'\n      && Boolean(lastState?.nativeStatus?.connected)\n      && supportsReliableWindowsOneClickUpdate(nativeVersion);\n    if (canOneClick) {\n      elements.updateDetail.textContent = `当前 ${currentVersion} · 最新 ${release.latestVersion} · Core ${nativeVersion} 支持安全一键更新`;\n      elements.installUpdate.textContent = '立即更新';\n    } else if (platform?.os === 'win') {\n      elements.updateDetail.textContent = `当前 ${currentVersion} · 最新 ${release.latestVersion} · Core ${nativeVersion || '未知'} 低于安全更新基线 ${RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION}；需一次性从发布页安装`;\n      elements.installUpdate.textContent = '打开发布页';\n    } else {\n      elements.updateDetail.textContent = `当前 ${currentVersion} · 最新 ${release.latestVersion} · 当前系统请从发布页安装`;\n      elements.installUpdate.textContent = '打开发布页';\n    }\n    elements.installUpdate.hidden = false;\n    return;\n  }\n",
          )
          replace_once(
              'extension/popup.js',
              "function render(state) {\n  lastState = state;\n  elements.version.textContent = state.extensionVersion || '';\n",
              "function render(state) {\n  lastState = state;\n  renderUpdate(latestRelease);\n  elements.version.textContent = state.extensionVersion || '';\n",
          )
          replace_once(
              'extension/popup.js',
              "    if (!state?.nativeStatus?.connected) {\n      throw new Error('本地核心离线，无法执行一键安装；请先点击“重新连接”或运行一次安装器修复 / Native Core is offline');\n    }\n\n    elements.updateDetail.textContent = `正在下载 ${release.latestVersion} 安装器…`;\n",
              "    if (!state?.nativeStatus?.connected) {\n      throw new Error('本地核心离线，无法执行一键安装；请先点击“重新连接”或运行一次安装器修复 / Native Core is offline');\n    }\n    if (!supportsReliableWindowsOneClickUpdate(state.nativeStatus.version)) {\n      elements.message.textContent = `当前 Core ${state.nativeStatus.version || '未知'} 低于安全更新基线 ${RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION}；请完成一次性手工升级。`;\n      await chrome.tabs.create({ url: release.releaseUrl || RELEASES_URL });\n      window.close();\n      return;\n    }\n\n    elements.updateDetail.textContent = `正在下载 ${release.latestVersion} 安装器…`;\n",
          )

          replace_once(
              'extension/tests/update-manager.test.mjs',
              "  parseLatestRelease,\n  updateStatusEventName,\n  WINDOWS_INSTALLER_NAME,\n",
              "  parseLatestRelease,\n  RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION,\n  supportsReliableWindowsOneClickUpdate,\n  updateStatusEventName,\n  WINDOWS_INSTALLER_NAME,\n",
          )
          replace_once(
              'extension/tests/update-manager.test.mjs',
              "test('parses a verified Windows installer from GitHub release metadata', () => {\n",
              "test('requires the safe updater core baseline for Windows one-click installs', () => {\n  assert.equal(RELIABLE_WINDOWS_UPDATER_MIN_CORE_VERSION, '0.5.6');\n  assert.equal(supportsReliableWindowsOneClickUpdate('0.5.5'), false);\n  assert.equal(supportsReliableWindowsOneClickUpdate('0.5.6'), true);\n  assert.equal(supportsReliableWindowsOneClickUpdate('0.5.7'), true);\n  assert.equal(supportsReliableWindowsOneClickUpdate('1.0.0'), true);\n  assert.equal(supportsReliableWindowsOneClickUpdate('bad'), false);\n  assert.equal(supportsReliableWindowsOneClickUpdate(null), false);\n});\n\ntest('parses a verified Windows installer from GitHub release metadata', () => {\n",
          )

          docs = Path('docs/WINDOWS_CODE_SIGNING.md')
          text = docs.read_text(encoding='utf-8')
          marker = "手工从浏览器下载并双击 `GPTLockSetup-x64.exe` 时，Windows 是否显示“未知发布者”取决于 Authenticode 数字签名。SHA-256 校验不能替代发布者签名。要让手工安装也显示可信发布者，需要为 Release 配置受 Windows 信任的代码签名证书。\n"
          addition = marker + "\n## 首次引导升级 / Bootstrap Upgrade\n\n`v0.5.5` 及更早版本的本地 Core 本身不具备“SHA-256 校验后解除 Mark-of-the-Web”的能力，因此旧 Core 无法通过发布一个新版本来被追溯修复。也就是说，从 `v0.5.5`（或更早）第一次跨到 `v0.5.6+` 时，如果 Windows 对未签名安装器触发 SmartScreen，必须完成一次人工确认/安装；或者使用公开受信任的 Authenticode 签名安装包。\n\n从 `v0.5.6` Core 起，安全一键更新基线已经建立：安装器先匹配 GitHub Release 的精确 SHA-256，再移除该已验证下载文件的 `Zone.Identifier`，之后才启动静默安装。扩展也会检查本地 Core 版本；低于 `0.5.6` 时不会再错误触发旧的一键更新链路，而是引导到发布页完成一次性 bootstrap。\n"
          if text.count(marker) != 1:
              raise SystemExit('docs bootstrap marker mismatch')
          docs.write_text(text.replace(marker, addition, 1), encoding='utf-8')
      - name: Run extension and license tests
        working-directory: extension
        run: npm test
      - name: Commit code patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/update-manager.js extension/popup.js extension/tests/update-manager.test.mjs docs/WINDOWS_CODE_SIGNING.md
          git commit -m 'fix: gate one-click updates on safe core baseline'
          git push origin HEAD:fix/updater-bootstrap-capability
