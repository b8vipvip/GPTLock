name: Repository housekeeping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: gptlock-repository-housekeeping
  cancel-in-progress: false

jobs:
  main-policy-audit:
    name: Audit PR-only main changes
    runs-on: ubuntu-latest
    steps:
      - name: Verify the main commit is associated with a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [[ "$count" -lt 1 ]]; then
            echo "::error::Direct push to main detected at $GITHUB_SHA. Repository policy requires changes to enter main through a merged pull request."
            exit 1
          fi
          echo "Main commit $GITHUB_SHA is associated with a merged pull request."

  prune-merged-branches:
    name: Prune merged development branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete fully merged short-lived branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          deleted=0
          kept=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == "HEAD" || "$branch" == "main" ]] && continue

            case "$branch" in
              feat/*|fix/*|codex/*|chore/*|refactor/*|test/*|ci-inspection-placeholder)
                ;;
              *)
                continue
                ;;
            esac

            if git merge-base --is-ancestor "$ref" "$GITHUB_SHA"; then
              echo "Deleting fully merged branch: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "::warning::Unable to delete $branch; leaving it in place."
                kept=$((kept + 1))
              fi
            else
              echo "Keeping unmerged branch: $branch"
              kept=$((kept + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          echo "Deleted merged branches: $deleted"
          echo "Kept unmerged/protected development branches: $kept"
