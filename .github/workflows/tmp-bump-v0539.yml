name: Temporary v0.5.39 Version Bump

on:
  push:
    branches:
      - fix/account-layout-payment-clarity-20260903

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-layout-payment-clarity-20260903
      - name: Bump release version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ["extension/manifest.json", "extension/package.json"]:
              p = Path(name)
              data = json.loads(p.read_text())
              data["version"] = "0.5.39"
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          p = Path("native-core/Cargo.toml")
          text = p.read_text()
          old = 'version = "0.5.38"'
          if old not in text:
              raise SystemExit("Cargo.toml release version not found")
          p.write_text(text.replace(old, 'version = "0.5.39"', 1))

          p = Path("native-core/Cargo.lock")
          text = p.read_text()
          old = 'name = "gptwork-core"\nversion = "0.5.38"'
          if old not in text:
              raise SystemExit("gptwork-core lock entry not found")
          p.write_text(text.replace(old, 'name = "gptwork-core"\nversion = "0.5.39"', 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock
          git commit -m "release: bump GPTWork to v0.5.39"
          git push origin HEAD:fix/account-layout-payment-clarity-20260903
