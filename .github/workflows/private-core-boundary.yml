name: Private Core Boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  boundary:
    name: Prevent new proprietary logic in public source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce frozen public-core paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -Eeuo pipefail

          override=false
          if jq -e '.[] | select(. == "public-core-maintenance")' <<<"$LABELS_JSON" >/dev/null; then
            override=true
          elif grep -Fq '[public-core-maintenance]' <<<"$PR_BODY"; then
            # The body marker exists so a narrowly scoped maintenance PR can pass
            # on its first opened/synchronize event even before label propagation.
            override=true
          fi

          frozen_regex='^(extension/(background|content|context-budget|context-remaining-indicator|guard|model-auto-lock|model-catalog|network-evidence|network-monitor|page-model-evidence|policy)\.js|native-core/src/(bridge|config|lib|verifier)\.rs)$'
          violations=0

          while IFS=$'\t' read -r status path rest; do
            [[ -n "${path:-}" ]] || continue
            if [[ "$path" =~ $frozen_regex ]]; then
              # Deletion is how the migration removes a legacy public implementation.
              if [[ "$status" == D* ]]; then
                echo "allowed deletion of frozen legacy source: $path"
                continue
              fi
              if [[ "$override" == true ]]; then
                echo "explicit public-core-maintenance override: $status $path"
                continue
              fi
              echo "::error file=$path::This is a frozen legacy public-core path. New implementation-sensitive behavior belongs in the private core. Delete the legacy file after replacement, or use the explicit public-core-maintenance label/body marker for a narrowly scoped compatibility or security fix."
              violations=$((violations + 1))
            fi
          done < <(git diff --name-status "$BASE_SHA"...HEAD)

          if (( violations > 0 )); then
            echo "$violations frozen public-core path(s) were modified." >&2
            exit 1
          fi

      - name: Reject proprietary markers in newly introduced public runtime code
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          frozen_regex='^(extension/(background|content|context-budget|context-remaining-indicator|guard|model-auto-lock|model-catalog|network-evidence|network-monitor|page-model-evidence|policy)\.js|native-core/src/(bridge|config|lib|verifier)\.rs)$'
          runtime_regex='^(extension/.*\.js|native-core/src/.*\.rs)$'
          sensitive_regex='backend-api/(f/)?conversation|resolved_model_slug|served_model_slug|stream_handoff|encoded_item|gpt-5\.6-sol-wm|x-openai-model|thinking_effort|MODEL_CONTEXT_WINDOWS|OFFICIAL_CONVERSATION_PATHS|MODEL_KEYS|REASONING_KEYS|SAFETY_BUDGET_RATIO|LEARNING_HEADROOM_RATIO|MESSAGE_OVERHEAD_TOKENS|IMAGE_TOKEN_ESTIMATE|ATTACHMENT_TOKEN_ESTIMATE|CONVERSATION_LENGTH_LIMIT_PATTERNS|extractResponseEvidence|streamPayloadMatches'
          violations=0

          while IFS=$'\t' read -r status path rest; do
            [[ -n "${path:-}" ]] || continue
            [[ "$status" == D* ]] && continue

            candidate="$path"
            if [[ "$status" == R* || "$status" == C* ]]; then
              candidate="${rest:-$path}"
            fi
            [[ "$candidate" =~ $runtime_regex ]] || continue
            [[ "$candidate" =~ $frozen_regex ]] && continue

            added_lines="$(
              git diff --unified=0 "$BASE_SHA"...HEAD -- "$candidate" \
                | awk '/^\+\+\+ / { next } /^\+/ { sub(/^\+/, ""); print }'
            )"
            if [[ -n "$added_lines" ]] && grep -Eqi "$sensitive_regex" <<<"$added_lines"; then
              echo "::error file=$candidate::New public runtime code contains an implementation-sensitive marker. Keep transport/UI adapters generic and move the rule, alias, endpoint or scoring logic into the private engine."
              violations=$((violations + 1))
            fi
          done < <(git diff --name-status "$BASE_SHA"...HEAD)

          if (( violations > 0 )); then
            echo "$violations public runtime file(s) introduced proprietary implementation markers." >&2
            exit 1
          fi

      - name: Reject private source material in public tree
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden='(^|/)(private-core|private-source|private-overlays|private-artifacts)(/|$)|\.private\.'
          if git ls-files | grep -E "$forbidden"; then
            echo "Private implementation material must not be committed to the public repository." >&2
            exit 1
          fi
