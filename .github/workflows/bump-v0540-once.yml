name: One-shot GPTWork v0.5.40 version sync

on:
  push:
    branches:
      - fix/custom-model-auto-routing-20260904

permissions:
  contents: write

jobs:
  bump:
    name: Synchronize release version declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-model-auto-routing-20260904
          fetch-depth: 0

      - name: Set v0.5.40 consistently
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          version = '0.5.40'

          for filename in ('extension/manifest.json', 'extension/package.json'):
              path = Path(filename)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['version'] = version
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo_toml = Path('native-core/Cargo.toml')
          text = cargo_toml.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('native-core/Cargo.toml version replacement failed')
          cargo_toml.write_text(updated, encoding='utf-8')

          cargo_lock = Path('native-core/Cargo.lock')
          text = cargo_lock.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(\[\[package\]\]\nname = "gptwork-core"\nversion = ")[^"]+("\n)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('native-core/Cargo.lock gptwork-core version replacement failed')
          cargo_lock.write_text(updated, encoding='utf-8')
          PY

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = '0.5.40'
          assert json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))['version'] == expected
          assert json.loads(Path('extension/package.json').read_text(encoding='utf-8'))['version'] == expected
          assert re.search(r'^version = "0\.5\.40"$', Path('native-core/Cargo.toml').read_text(encoding='utf-8'), re.M)
          lock = Path('native-core/Cargo.lock').read_text(encoding='utf-8')
          assert 'name = "gptwork-core"\nversion = "0.5.40"' in lock
          PY

      - name: Commit synchronized version
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Version declarations are already synchronized.'
            exit 0
          fi
          git commit -m 'release: bump GPTWork to v0.5.40'
          git push origin HEAD:fix/custom-model-auto-routing-20260904
