name: Refresh v0.5.1 Cargo lock

on:
  push:
    branches:
      - release/v0.5.1
    paths:
      - 'native-core/Cargo.toml'
      - '.github/workflows/refresh-v0.5.1-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock from Cargo.toml
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Commit lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already matches Cargo.toml.'
            exit 0
          fi
          git diff --cached -- native-core/Cargo.lock
          git commit -m 'chore: refresh Cargo.lock for v0.5.1'
          git push origin HEAD:release/v0.5.1
