name: Sync Cargo lock

on:
  push:
    branches:
      - feat/ui-hot-update

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-hot-update
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile metadata
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- native-core/Cargo.lock; then
            echo "Cargo.lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock
          git commit -m "chore: sync Cargo.lock for 0.4.0"
          git push origin HEAD:feat/ui-hot-update
