name: Final GPTLock polish

on:
  push:
    branches:
      - fix/context-hard-limit-admin-ui-license-compat

permissions:
  contents: write

jobs:
  polish-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-hard-limit-admin-ui-license-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply final polish
        run: python3 scripts/final-polish.py
      - name: Extension and server regression suite
        run: npm test --prefix extension
      - name: Rust lock/version sanity
        run: cargo check --locked --manifest-path native-core/Cargo.toml
      - name: Remove one-shot polish machinery
        run: rm -f scripts/final-polish.py .github/workflows/final-polish.yml
      - name: Commit tested polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make learned caps and admin edits robust'
          git push origin HEAD:fix/context-hard-limit-admin-ui-license-compat
