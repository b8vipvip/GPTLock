name: Refresh release lockfile

on:
  push:
    branches:
      - release/v0.4.5

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.4.5
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock package version
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git commit -m 'chore: refresh Cargo.lock for 0.4.5'
          git push origin HEAD:release/v0.4.5
