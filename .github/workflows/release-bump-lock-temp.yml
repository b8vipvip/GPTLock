name: Temporary release lockfile refresh

on:
  push:
    branches:
      - release-v0.5.34

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.5.34
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh native-core lockfile metadata
        run: cargo check --manifest-path native-core/Cargo.toml --quiet
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native-core/Cargo.lock; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          git commit -m 'chore: refresh v0.5.34 lockfile'
          git push origin HEAD:release-v0.5.34
