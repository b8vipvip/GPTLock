name: Temporary Persistent Context Patch

on:
  push:
    branches:
      - feat/persistent-context-state

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-context-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply persistent context patch
        run: python3 tools/_tmp_patch_persistent_context.py
      - name: Run extension and license server tests
        working-directory: extension
        run: npm test
      - name: Remove temporary patch tooling
        run: |
          rm -f tools/_tmp_patch_persistent_context.py
          rm -f .github/workflows/_tmp-persistent-context.yml
      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: persist context state across browser sessions"
          git push origin HEAD:feat/persistent-context-state
