name: Temporary v0.5.7 Release Bump

on:
  push:
    branches:
      - release/v0.5.7

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump version metadata
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('native-core/Cargo.toml', 'version = "0.5.6"', 'version = "0.5.7"')
          replace_once('native-core/Cargo.lock', 'name = "gptlock-core"\nversion = "0.5.6"', 'name = "gptlock-core"\nversion = "0.5.7"')
          replace_once('extension/manifest.json', '"version": "0.5.6"', '"version": "0.5.7"')
          replace_once('extension/package.json', '"version": "0.5.6"', '"version": "0.5.7"')
      - name: Verify extension and license tests
        working-directory: extension
        run: npm test
      - name: Verify Rust lockfile and tests
        run: |
          cargo test --locked --manifest-path native-core/Cargo.toml
          cargo build --locked --release --manifest-path native-core/Cargo.toml
      - name: Commit v0.5.7 metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.toml native-core/Cargo.lock extension/manifest.json extension/package.json
          git commit -m 'release: GPTLock v0.5.7'
          git push origin HEAD:release/v0.5.7
