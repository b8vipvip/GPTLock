name: Apply v0.5.14 updater syntax fix

on:
  push:
    branches:
      - fix/windows-one-click-update-v0.5.14

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-one-click-update-v0.5.14
      - name: Fix updater syntax and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('extension/options-update.js')
          source = path.read_text(encoding='utf-8')
          old = '  setBusy(true;\n'
          new = '  setBusy(true);\n'
          if old not in source:
              raise SystemExit('expected updater typo not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-v0514-syntax-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/options-update.js .github/workflows/apply-v0514-syntax-fix.yml
          git commit -m 'fix: close updater busy-state call'
          git push origin HEAD:fix/windows-one-click-update-v0.5.14
