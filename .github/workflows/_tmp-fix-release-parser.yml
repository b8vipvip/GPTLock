name: Temporary release parser fix

on:
  push:
    branches:
      - fix/release-powershell-parser

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-powershell-parser
      - name: Patch and verify PowerShell syntax
        shell: pwsh
        run: |
          $path = '.github/workflows/release.yml'
          $text = Get-Content -LiteralPath $path -Raw
          $old = 'throw "Authenticode signature is not valid for $Path: $($signature.Status)"'
          $new = 'throw "Authenticode signature is not valid for ${Path}: $($signature.Status)"'
          if (-not $text.Contains($old)) { throw 'Expected release parser expression was not found.' }
          Set-Content -LiteralPath $path -Value ($text.Replace($old, $new)) -NoNewline -Encoding utf8
          $yaml = Get-Content -LiteralPath $path -Raw
          if (-not $yaml.Contains('${Path}:')) { throw 'Parser fix was not applied.' }
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/_tmp-fix-release-parser.yml
      - name: Commit parser fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct release PowerShell variable parsing'
          git push origin HEAD:fix/release-powershell-parser
