name: Temporary GPTWork v0.5.37 Fix

on:
  push:
    branches:
      - fix/gptwork-assets-chat-length-v0537-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gptwork-assets-chat-length-v0537-20260903
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 .github/tmp-gptwork-v0537-fix.py
      - name: Refresh lockfile and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile --manifest-path native-core/Cargo.toml
          cargo metadata --locked --no-deps --manifest-path native-core/Cargo.toml >/dev/null
          rm -f .github/workflows/tmp-gptwork-v0537-fix.yml .github/tmp-gptwork-v0537-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize GPTWork assets and chat length v0.5.37'
          git push origin HEAD:fix/gptwork-assets-chat-length-v0537-20260903
