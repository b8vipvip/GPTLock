name: One-shot GPTLock 0.3.8 stream evidence fix

on:
  push:
    branches:
      - fix/nested-stream-evidence-038

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nested-stream-evidence-038
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.3.8 fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch target in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'extension/network-evidence.js',
              "  'resolved_model',\n  'served_model',\n  'model',\n",
              "  'resolved_model',\n  'resolved_model_slug',\n  'served_model',\n  'served_model_slug',\n  'used_model_slug',\n  'default_model_slug',\n  'model',\n",
          )
          replace_once(
              'extension/network-evidence.js',
              "  'thinking_level',\n  'thinkinglevel',\n]);\n",
              "  'thinking_level',\n  'thinkinglevel',\n  'thinking_effort',\n]);\n",
          )
          replace_once(
              'extension/network-evidence.js',
              "const SKIPPED_CONTENT_KEYS = new Set([\n  'content',\n  'parts',\n  'text',\n  'prompt',\n  'input',\n  'output_text',\n  'arguments',\n]);\n",
              "const SKIPPED_CONTENT_KEYS = new Set([\n  'content',\n  'parts',\n  'text',\n  'prompt',\n  'input',\n  'output_text',\n  'arguments',\n]);\nconst EMBEDDED_STREAM_KEYS = new Set([\n  'encoded_item',\n]);\n",
          )
          embedded_helper = "function collectEmbeddedStreamObjects(value, objects, depth = 0) {\n  if (depth > 10 || value === null || typeof value !== 'object') return;\n  if (Array.isArray(value)) {\n    for (const child of value) collectEmbeddedStreamObjects(child, objects, depth + 1);\n    return;\n  }\n  for (const [rawKey, child] of Object.entries(value)) {\n    const key = canonicalKey(rawKey);\n    if (EMBEDDED_STREAM_KEYS.has(key) && typeof child === 'string' && child.length <= MAX_BODY_CHARS) {\n      const trimmed = child.trim();\n      const parsed = parseJson(trimmed);\n      if (parsed && typeof parsed === 'object') {\n        objects.push(parsed);\n        collectEmbeddedStreamObjects(parsed, objects, depth + 1);\n      }\n      const sseObjects = parseSseObjects(trimmed);\n      if (sseObjects.length) {\n        objects.push(...sseObjects);\n        for (const object of sseObjects) collectEmbeddedStreamObjects(object, objects, depth + 1);\n      }\n      continue;\n    }\n    if (!SKIPPED_CONTENT_KEYS.has(key)) collectEmbeddedStreamObjects(child, objects, depth + 1);\n  }\n}\n\n"
          replace_once(
              'extension/network-evidence.js',
              "export function extractStreamHandoff(body = '') {\n",
              embedded_helper + "export function extractStreamHandoff(body = '') {\n",
          )
          replace_once(
              'extension/network-evidence.js',
              "  if (!values.length && trimmed.includes('\\n')) {\n    for (const line of trimmed.split(/\\r?\\n/)) {\n      const parsed = parseJson(line.trim());\n      if (parsed && typeof parsed === 'object') values.push(parsed);\n    }\n    if (values.length) formats.push('ndjson');\n  }\n  return {\n",
              "  if (!values.length && trimmed.includes('\\n')) {\n    for (const line of trimmed.split(/\\r?\\n/)) {\n      const parsed = parseJson(line.trim());\n      if (parsed && typeof parsed === 'object') values.push(parsed);\n    }\n    if (values.length) formats.push('ndjson');\n  }\n  const embedded = [];\n  for (const value of [...values]) collectEmbeddedStreamObjects(value, embedded);\n  if (embedded.length) {\n    values.push(...embedded);\n    formats.push('embedded-sse');\n  }\n  return {\n",
          )

          replace_once(
              'extension/policy.js',
              "const MODEL_ALIASES = Object.freeze({\n  'gpt-5.6-sol-wm': 'gpt-5.6-sol',\n});\n",
              "const MODEL_ALIASES = Object.freeze({\n  'gpt-5.6-sol-wm': 'gpt-5.6-sol',\n  'gpt-5-6': 'gpt-5.6-sol',\n});\n",
          )
          replace_once(
              'extension/policy.js',
              "  if (['extra high', 'extra_high', 'extra-high', 'xhigh'].includes(level)) return 'extra-high';\n  return ['low', 'medium', 'high'].includes(level) ? level : null;\n",
              "  if (['extra high', 'extra_high', 'extra-high', 'xhigh'].includes(level)) return 'extra-high';\n  if (level === 'extended') return 'high';\n  return ['low', 'medium', 'high'].includes(level) ? level : null;\n",
          )

          observation_helper = "  function firstNormalizedElements(elements, normalize) {\n    for (const element of elements) {\n      for (const text of elementTexts(element)) {\n        const value = normalize(text);\n        if (value) return value;\n      }\n    }\n    return null;\n  }\n\n  function composerNearbyControls() {\n    const composer = COMPOSER_SELECTORS\n      .map((selector) => document.querySelector(selector))\n      .find((element) => element && visible(element));\n    if (!composer) return [];\n    const composerRect = composer.getBoundingClientRect();\n    return [...document.querySelectorAll('button,[role=\\\"button\\\"],[aria-haspopup]')].filter((element) => {\n      if (!visible(element)) return false;\n      const rect = element.getBoundingClientRect();\n      return rect.bottom >= composerRect.top - 96 && rect.top <= composerRect.bottom + 96;\n    });\n  }\n\n"
          replace_once(
              'extension/content.js',
              "  function normalizeDisplayedModel(text) {\n",
              observation_helper + "  function normalizeDisplayedModel(text) {\n",
          )
          replace_once(
              'extension/content.js',
              "  function collectObservation() {\n    const model = firstNormalized(MODEL_SELECTORS, normalizeDisplayedModel)\n      || firstNormalized(['button'], normalizeDisplayedModel);\n    const reasoning = firstNormalized(REASONING_SELECTORS, normalizeDisplayedReasoning)\n      || firstNormalized(MODEL_SELECTORS, normalizeDisplayedReasoning)\n      || (model ? firstNormalized(['button'], normalizeDisplayedReasoning) : null);\n",
              "  function collectObservation() {\n    const nearbyControls = composerNearbyControls();\n    const model = firstNormalized(MODEL_SELECTORS, normalizeDisplayedModel)\n      || firstNormalizedElements(nearbyControls, normalizeDisplayedModel)\n      || firstNormalized(['button,[role=\\\"button\\\"]'], normalizeDisplayedModel);\n    const reasoning = firstNormalized(REASONING_SELECTORS, normalizeDisplayedReasoning)\n      || firstNormalizedElements(nearbyControls, normalizeDisplayedReasoning)\n      || firstNormalized(MODEL_SELECTORS, normalizeDisplayedReasoning)\n      || (model ? firstNormalized(['button,[role=\\\"button\\\"]'], normalizeDisplayedReasoning) : null);\n",
          )
          replace_once(
              'extension/content.js',
              "host.style.cssText = 'all:initial;position:fixed;left:12px;bottom:12px;z-index:2147483647';",
              "host.style.cssText = 'all:initial;position:fixed;right:12px;bottom:12px;z-index:2147483647';",
          )
          replace_once(
              'extension/content.js',
              "      page_selection_missing: '页面没有暴露完整选择；正式请求仍会尝试锁定 / UI selection is incomplete; request locking still applies',",
              "      page_selection_missing: '页面未暴露完整选择；网络请求锁仍已就绪 / UI selection is incomplete; network request lock remains ready',",
          )

          replace_once(
              'extension/guard.js',
              "  if (!uiComplete) {\n    return {\n      ...base,\n      allowKind: 'warning',\n      status: 'preflight_unknown',\n      reason: 'page_selection_missing',\n    };\n  }\n",
              "  if (!uiComplete) {\n    return {\n      ...base,\n      allowKind: 'locked',\n      status: 'lock_ready',\n      reason: 'page_selection_missing',\n    };\n  }\n",
          )

          replace_once(
              'extension/popup.js',
              "    model_not_exposed: '正式请求已经锁定，但流式响应和会话详情都没有暴露可验证模型元数据。',\n",
              "    model_not_exposed: '正式请求已经锁定，但流式响应和会话详情都没有暴露可验证模型元数据。',\n    downstream_model_not_exposed: '已跟踪 handoff 后续流，但尚未从嵌套流元数据中解析出模型。',\n",
          )
          replace_once(
              'extension/popup.js',
              "    auto_verify_response_timeout: '自动验证等待响应确认超时。',\n  };\n",
              "    auto_verify_response_timeout: '自动验证等待响应确认超时。',\n    page_selection_missing: '页面当前未暴露完整模型/推理选择；网络请求锁仍已就绪。',\n  };\n",
          )
          replace_once(
              'extension/popup.js',
              "  elements.guardDetail.textContent = [detail, rewriteDetail, evidenceDetail, guard?.reason].filter(Boolean).join(' · ');\n",
              "  const rawReason = guard?.reason && !evidenceDetail ? guard.reason : null;\n  elements.guardDetail.textContent = [detail, rewriteDetail, evidenceDetail, rawReason].filter(Boolean).join(' · ');\n",
          )

          test_path = Path('extension/tests/network-evidence.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          nested_lines = [
              "",
              "test('extracts model and thinking effort from nested ChatGPT WebSocket encoded_item SSE', () => {",
              "  const encodedItem = [",
              "    'event: delta',",
              "    'data: {\\\"v\\\":{\\\"message\\\":{\\\"author\\\":{\\\"role\\\":\\\"assistant\\\"},\\\"metadata\\\":{\\\"resolved_model_slug\\\":\\\"gpt-5-6\\\",\\\"model_slug\\\":\\\"gpt-5-6\\\",\\\"default_model_slug\\\":\\\"gpt-5.6-sol-wm\\\",\\\"thinking_effort\\\":\\\"extended\\\"}}}}',",
              "    '',",
              "  ].join('\\\\n');",
              "  const body = JSON.stringify([{ type: 'message', topic_id: 'conversation-turn-test', payload: { type: 'conversation-turn-stream', payload: { type: 'stream-item', encoded_item: encodedItem } } }]);",
              "  const result = extractResponseEvidence({ body, mimeType: 'application/json' });",
              "  assert.equal(result.model, 'gpt-5.6-sol');",
              "  assert.equal(result.reasoning, 'high');",
              "  assert.match(result.diagnostics.bodyFormat, /embedded-sse/);",
              "  assert.match(result.fields.model, /resolved_model_slug/);",
              "  assert.match(result.fields.reasoning, /thinking_effort/);",
              "});",
              "",
          ]
          if 'nested ChatGPT WebSocket encoded_item SSE' not in test_text:
              test_path.write_text(test_text + '\n'.join(nested_lines), encoding='utf-8')

          guard_test = Path('extension/tests/guard.test.mjs')
          guard_text = guard_test.read_text(encoding='utf-8')
          old_guard = "test('missing page fields are warning-only instead of a send gate', () => {\n  const guard = evaluateGuard({\n    state: state({ pageObservation: { model: null, reasoning: null } }),\n    policy: DEFAULT_POLICY,\n    settings: DEFAULT_SETTINGS,\n  });\n  assert.equal(guard.canSend, true);\n  assert.equal(guard.allowKind, 'warning');\n  assert.equal(guard.status, 'preflight_unknown');\n});"
          new_guard = "test('missing page fields keep the network request lock ready', () => {\n  const guard = evaluateGuard({\n    state: state({ pageObservation: { model: null, reasoning: null } }),\n    policy: DEFAULT_POLICY,\n    settings: DEFAULT_SETTINGS,\n  });\n  assert.equal(guard.canSend, true);\n  assert.equal(guard.allowKind, 'locked');\n  assert.equal(guard.status, 'lock_ready');\n  assert.equal(guard.reason, 'page_selection_missing');\n});"
          if old_guard not in guard_text:
              raise SystemExit('missing guard test patch target')
          guard_test.write_text(guard_text.replace(old_guard, new_guard, 1), encoding='utf-8')

          safety = Path('extension/tests/content-safety.test.mjs')
          safety_text = safety.read_text(encoding='utf-8')
          safety_lines = [
              "",
              "test('floating status is anchored bottom-right and broad role-button scan is observation-only', () => {",
              "  assert.match(content, /position:fixed;right:12px;bottom:12px/);",
              "  assert.match(content, /composerNearbyControls\\(\\)/);",
              "  assert.doesNotMatch(content, /chooseExact\\(\\['button/);",
              "});",
              "",
          ]
          if 'floating status is anchored bottom-right' not in safety_text:
              safety.write_text(safety_text + '\n'.join(safety_lines), encoding='utf-8')

          manifest_path = Path('extension/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.3.8'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          package_path = Path('extension/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.3.8'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          replace_once('native-core/Cargo.toml', 'version = "0.3.7"', 'version = "0.3.8"')
          lock_path = Path('native-core/Cargo.lock')
          lock_text = lock_path.read_text(encoding='utf-8')
          marker = 'name = "gptlock-core"\nversion = "0.3.7"'
          if marker not in lock_text:
              raise SystemExit('missing Cargo.lock gptlock-core version marker')
          lock_path.write_text(lock_text.replace(marker, 'name = "gptlock-core"\nversion = "0.3.8"', 1), encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          note = '> v0.3.8: parses nested WebSocket `encoded_item` SSE response metadata (`resolved_model_slug` / `thinking_effort`), improves composer-scoped UI observation, and moves the floating status badge to the bottom-right.\n\n'
          if note not in readme_text:
              heading = '# GPTLock\n\n'
              readme_text = readme_text.replace(heading, heading + note, 1) if heading in readme_text else note + readme_text
              readme.write_text(readme_text, encoding='utf-8')
          PY
      - name: Test extension
        working-directory: extension
        run: npm test
      - name: Validate version consistency
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = "0.3.8"
          test "$(node -p "require('./extension/package.json').version")" = "0.3.8"
          grep -q '^version = "0.3.8"' native-core/Cargo.toml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md extension native-core/Cargo.toml native-core/Cargo.lock
          git commit -m "GPTLock 0.3.8: parse nested response metadata and refine UI status"
          git push origin HEAD:fix/nested-stream-evidence-038
