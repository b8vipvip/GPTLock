name: Temporary Generate GPTWork v0.5.37 Release Workflow

on:
  push:
    branches:
      - fix/gptwork-assets-chat-length-v0537-20260903

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gptwork-assets-chat-length-v0537-20260903
          fetch-depth: 0
      - name: Generate release workflow copy
        run: python3 tools/tmp_release_asset_case.py
      - name: Commit generated copy
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-v0537.generated.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: generate GPTWork v0.5.37 release workflow copy'
          git push origin HEAD:fix/gptwork-assets-chat-length-v0537-20260903
