name: Refresh v0.5.14 lockfile

on:
  push:
    branches:
      - fix/windows-one-click-update-v0.5.14

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-one-click-update-v0.5.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh root package version in Cargo.lock
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- native-core/Cargo.lock; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          git commit -m 'chore: refresh Cargo.lock for v0.5.14'
          git pull --rebase origin fix/windows-one-click-update-v0.5.14
          git push origin HEAD:fix/windows-one-click-update-v0.5.14
