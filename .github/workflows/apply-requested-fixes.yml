name: Apply requested GPTLock fixes

on:
  push:
    branches:
      - fix/context-hard-limit-admin-ui-license-compat

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-hard-limit-admin-ui-license-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply deterministic patch
        run: node scripts/apply-requested-fixes.mjs
      - name: Extension and server regression suite
        run: npm test --prefix extension
      - name: Rust lock/version sanity
        run: cargo check --locked --manifest-path native-core/Cargo.toml
      - name: Remove one-shot patch machinery
        run: rm -f scripts/apply-requested-fixes.mjs .github/workflows/apply-requested-fixes.yml
      - name: Commit tested fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: learn real context limits and improve account admin UX'
          git push origin HEAD:fix/context-hard-limit-admin-ui-license-compat
