name: temp-private-context-authority
on:
  push:
    branches:
      - refactor/private-context-budget-authority-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/private-context-budget-authority-v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply authority migration
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -q 'private-context-budget-authority.js' extension/manifest.json; then
            echo 'authority migration already applied'
            exit 0
          fi
          python .github/scripts/tmp_private_context_authority.py
          cargo fmt --manifest-path native-core/Cargo.toml
          cargo fmt --manifest-path private-engine/Cargo.toml
          node --check extension/private-core-channel.js
          node --check extension/private-context-bridge.js
          node --check extension/private-context-budget-authority.js
          node --check extension/context-budget.js
          node --test \
            extension/tests/private-core-channel-capability.test.mjs \
            extension/tests/private-context-budget-authority.test.mjs \
            extension/tests/private-context-authority-integration.test.mjs \
            extension/tests/private-context-bridge.test.mjs
      - name: Commit migrated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -q 'private-context-budget-shadow.js' extension/manifest.json; then
            echo 'migration was not applied' >&2
            exit 1
          fi
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            native-core/src/private_engine.rs \
            private-engine/src/context_budget.rs \
            extension/private-core-channel.js \
            extension/private-context-bridge.js \
            extension/context-budget.js \
            extension/private-context-budget-authority.js \
            extension/private-context-budget-shadow.js \
            extension/manifest.json \
            extension/package.json \
            extension/tests/private-context-budget-authority.test.mjs \
            extension/tests/private-context-budget-shadow.test.mjs \
            extension/tests/private-core-channel-capability.test.mjs \
            extension/tests/private-context-authority-integration.test.mjs
          if git diff --cached --quiet; then
            echo 'no runtime changes to commit'
            exit 0
          fi
          git commit -m 'refactor(context): make private engine budget authoritative'
          git push origin HEAD:refactor/private-context-budget-authority-v1
