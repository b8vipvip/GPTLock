name: Temporary context isolation v0.5.41 patch

on:
  push:
    branches:
      - fix/context-budget-conversation-isolation-v0541-20260905

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-budget-conversation-isolation-v0541-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/tmp-context-isolation-v0541.py
      - name: Syntax checks
        run: |
          node --check extension/context-budget.js
          node --check extension/chat-length-remaining-indicator.js
          node --check extension/background.js
      - name: Focused regression tests
        run: |
          node --test \
            extension/tests/context-budget.test.mjs \
            extension/tests/chat-length-remaining-indicator.test.mjs \
            extension/tests/multi-conversation-context-isolation.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension native-core
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'fix: isolate chat-length state per conversation'
          git push origin HEAD:fix/context-budget-conversation-isolation-v0541-20260905
