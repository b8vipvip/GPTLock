name: Fix trusted legacy network evidence

on:
  push:
    branches:
      - fix/trusted-model-discovery
    paths:
      - .github/workflows/fix-trusted-legacy-network.yml
      - .github/fix-trusted-legacy-network.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trusted-model-discovery
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python .github/fix-trusted-legacy-network.py
      - name: Run extension tests
        working-directory: extension
        run: npm test
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/model-catalog.js extension/model-catalog-options.js extension/tests/model-discovery.test.mjs
          git diff --cached --exit-code && { echo 'Fix produced no changes'; exit 1; } || true
          git commit -m 'fix: allow trusted network evidence to restore model IDs'
          git push origin HEAD:fix/trusted-model-discovery
