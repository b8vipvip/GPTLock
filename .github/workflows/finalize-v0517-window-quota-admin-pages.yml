name: Finalize v0.5.17 window quota removal and admin pages

on:
  push:
    branches:
      - fix/remove-window-quota-admin-pages-v0517
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply root-cause fixes and split admin pages
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # ---- Version + cache-proof Settings entrypoint ----
          manifest_path = Path('extension/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.5.17'
          manifest['options_ui']['page'] = 'settings-v0517.html'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = Path('extension/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.5.17'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo = read('native-core/Cargo.toml')
          cargo = replace_once(cargo, 'version = "0.5.16"', 'version = "0.5.17"', 'Cargo.toml version')
          write('native-core/Cargo.toml', cargo)

          options = read('extension/options.html')
          if '授权验证 / License' in options or 'id="licenseCode"' in options or 'GPTL-' in options:
              raise SystemExit('current options.html unexpectedly contains legacy License UI')
          settings = options.replace('<title>GPTLock 设置</title>', '<title>GPTLock 设置 0.5.17</title>', 1)
          settings = settings.replace('<body>', '<body data-settings-revision="v0517-no-license-window-quota">', 1)
          write('extension/settings-v0517.html', settings)

          shell = read('extension/popup-v0513-shell.js')
          shell = replace_once(shell, "chrome.runtime.getURL('options.html#updates-auto')", "chrome.runtime.getURL('settings-v0517.html#updates-auto')", 'popup update route')
          write('extension/popup-v0513-shell.js', shell)

          # ---- Extension: account entitlement remains, concurrent-window quota does not ----
          background = read('extension/background.js')
          old = '''function accountAllowsState(state) {\n  if (!accountState?.authenticated || !accountState?.entitlement?.active) return false;\n  if (!Number.isInteger(state?.windowId)) return false;\n  return Array.isArray(accountState.allowedWindowKeys) && accountState.allowedWindowKeys.includes(`chrome:${state.windowId}`);\n}'''
          new = '''function accountAllowsState(_state) {\n  // Account entitlement controls access, but the number of Chrome windows never does.\n  // Window keys remain heartbeat telemetry only and must not disable GPTLock.\n  return Boolean(accountState?.authenticated && accountState?.entitlement?.active);\n}'''
          background = replace_once(background, old, new, 'background accountAllowsState')

          old = '''      case 'GPTLOCK-LICENSE-GET':\n      case 'GPTLOCK_LICENSE_GET': {\n        const entitlement = accountState?.entitlement || null;\n        const authorized = Boolean(accountState?.authenticated && entitlement?.active);\n        return {\n          authorized,\n          status: authorized ? 'active' : 'migrated_to_account',\n          legacyUi: true,\n          accountRequired: true,\n          licenseRequired: false,\n          license: authorized ? {\n            expiresAt: entitlement?.expiresAt ?? null,\n            limits: entitlement?.limits ?? null,\n            usage: entitlement?.usage ?? null,\n            label: 'GPTLock account entitlement',\n          } : null,\n          lastError: authorized\n            ? '旧授权码界面已停用；当前授权来自 GPTLock 账号权益。关闭并重新打开扩展弹窗即可加载新版界面。'\n            : '授权码已停用；GPTLock 当前使用账号登录与会员权益。关闭并重新打开扩展弹窗，必要时完全重启浏览器。',\n        };\n      }'''
          new = '''      case 'GPTLOCK-LICENSE-GET':\n      case 'GPTLOCK_LICENSE_GET':\n        // Never synthesize an active legacy License from account entitlement. A stale\n        // cached UI must see the License system as removed, not as a quota-bearing grant.\n        return {\n          authorized: false,\n          status: 'removed',\n          legacyUi: true,\n          accountRequired: true,\n          licenseRequired: false,\n          license: null,\n          lastError: '授权码系统已移除；请使用 GPTLock 账号权益。若仍看到授权码界面，请关闭旧页面并从扩展重新打开设置。',\n        };'''
          background = replace_once(background, old, new, 'legacy License GET bridge')
          background = background.replace('当前账号没有有效权益，或当前窗口已超过同时窗口上限', '当前账号没有有效权益')
          write('extension/background.js', background)

          auth = read('extension/auth-gate.js')
          auth = replace_once(auth, 'function renderAccount(account, windowAccess = true) {', 'function renderAccount(account) {', 'auth renderAccount signature')
          auth = replace_once(auth,
              "  el.accountUsage.textContent = `设备 ${usage.devices ?? 0}/${limits.devices ?? 0} · 窗口 ${usage.windows ?? 0}/${limits.windows ?? 0}`;",
              "  el.accountUsage.textContent = `设备 ${usage.devices ?? 0}/${limits.devices ?? 0} · 窗口不限`;",
              'auth account usage')
          old = '''  if (el.enabled) {\n    el.enabled.disabled = !entitlement.active || !windowAccess;\n    if (!entitlement.active) el.enabled.title = '免费期或会员已到期，请在账户中心开通会员';\n    else if (!windowAccess) el.enabled.title = '当前窗口超过账户同时窗口上限';\n    else el.enabled.title = '启用或关闭 GPTLock';\n  }'''
          new = '''  if (el.enabled) {\n    el.enabled.disabled = !entitlement.active;\n    if (!entitlement.active) el.enabled.title = '免费期或会员已到期，请在账户中心开通会员';\n    else el.enabled.title = '启用或关闭 GPTLock；窗口数量不受限制';\n  }'''
          auth = replace_once(auth, old, new, 'auth enable gate')
          auth = replace_once(auth, '    renderAccount(account, state?.accountWindowAllowed !== false);', '    renderAccount(account);', 'auth refresh gate')
          write('extension/auth-gate.js', auth)

          popup = read('extension/popup-v0513.html')
          popup = replace_once(popup, '<span id="accountUsage">设备/窗口 —</span>', '<span id="accountUsage">设备 — · 窗口不限</span>', 'popup account usage placeholder')
          write('extension/popup-v0513.html', popup)

          account_html = read('extension/account.html')
          account_html = replace_once(account_html, '      <article class="card"><span>同时窗口</span><strong id="windowUsage">—</strong></article>\n', '', 'account window stat')
          account_html = replace_once(account_html, '价格、设备与窗口权益由服务端统一配置。', '价格与设备权益由服务端统一配置；GPTLock 同时窗口不限。', 'account plan description')
          write('extension/account.html', account_html)

          account_js = read('extension/account.js')
          account_js = replace_once(account_js, '  deviceUsage: $(\'deviceUsage\'), windowUsage: $(\'windowUsage\'), freeExpiry: $(\'freeExpiry\'), memberExpiry: $(\'memberExpiry\'), plans: $(\'plans\'), orderMessage: $(\'orderMessage\'),', "  deviceUsage: $('deviceUsage'), freeExpiry: $('freeExpiry'), memberExpiry: $('memberExpiry'), plans: $('plans'), orderMessage: $('orderMessage'),", 'account js elements')
          account_js = replace_once(account_js, "    for (const item of plan.benefits || []) { const li = document.createElement('li'); li.textContent = item; benefits.append(li); }", "    for (const item of plan.benefits || []) { if (/窗口|window/i.test(String(item))) continue; const li = document.createElement('li'); li.textContent = item; benefits.append(li); }", 'account benefits filter')
          account_js = replace_once(account_js, "    const limit = document.createElement('p'); limit.className = 'muted'; limit.textContent = `设备 ${plan.limits.devices} · 同时窗口 ${plan.limits.windows}`;", "    const limit = document.createElement('p'); limit.className = 'muted'; limit.textContent = `设备 ${plan.limits.devices} · 同时窗口不限`;", 'account plan limit')
          account_js = replace_once(account_js, '  el.windowUsage.textContent = `${entitlement.usage?.windows ?? 0} / ${entitlement.limits?.windows ?? 0}`;\n', '', 'account window usage')
          write('extension/account.js', account_js)

          # ---- Server: keep window leases as telemetry but never ration them ----
          system = read('license-server/account-system.mjs')
          old = '''        const existingRows = db.prepare('SELECT window_key FROM user_window_leases WHERE session_id=? ORDER BY first_seen_at').all(session.id);\n        const existing = existingRows.map((row) => row.window_key).filter((key) => requested.includes(key));\n        const otherCount = db.prepare(`SELECT COUNT(*) AS count FROM user_window_leases wl JOIN user_sessions s ON s.id=wl.session_id\n          WHERE s.user_id=? AND s.id<>? AND s.revoked_at IS NULL AND s.expires_at>?`).get(session.user_id, session.id, nowIso()).count;\n        const capacity = entitlement.active ? Math.max(0, entitlement.limits.windows - otherCount) : 0;\n        const allowed = [...existing].slice(0, capacity);\n        for (const key of requested) if (!allowed.includes(key) && allowed.length < capacity) allowed.push(key);'''
          new = '''        // Window leases are telemetry/liveness records only. Account entitlement may\n        // enable GPTLock, but concurrent Chrome window count is intentionally unlimited.\n        const allowed = entitlement.active ? requested : [];'''
          system = replace_once(system, old, new, 'server heartbeat window quota')
          write('license-server/account-system.mjs', system)

          # ---- Admin UI: remove window quota controls and split each navigation item into a real page ----
          admin_source = read('license-server/public/admin.html')
          admin_source = admin_source.replace('管理账号状态、免费期限、设备/窗口自定义上限、会员和设备绑定。', '管理账号状态、免费期限、设备上限、会员和设备绑定；同时窗口不限。')
          admin_source = admin_source.replace('            <label>自定义窗口上限<input id="createUserWindows" type="number" min="1" max="1000" placeholder="留空=跟随默认/套餐"></label>\n', '')
          admin_source = admin_source.replace('<th>设备上限</th><th>窗口上限</th><th>有效期</th>', '<th>设备上限</th><th>有效期</th>')
          admin_source = admin_source.replace('月卡、季卡、年卡的价格、期限、设备与窗口权益均可在线调整。', '月卡、季卡、年卡的价格、期限与设备权益可在线调整；同时窗口不限。')
          admin_source = admin_source.replace('          <label>同时窗口上限<input id="freeWindows" type="number" min="1"></label>\n', '')

          def extract(pattern, label):
              match = re.search(pattern, admin_source, re.S)
              if not match:
                  raise SystemExit(f'admin source missing {label}')
              return match.group(0)

          login = extract(r'<section id="login"\b.*?</section>', 'login section')
          dialog = extract(r'<dialog id="userPasswordDialog"\b.*?</dialog>', 'password dialog')
          sections = {
              'overview': extract(r'<section id="overview"\b.*?</section>', 'overview section'),
              'users': extract(r'<section id="users"\b.*?</section>', 'users section'),
              'plans': extract(r'<section id="plans"\b.*?</section>', 'plans section'),
              'orders': extract(r'<section id="orders"\b.*?</section>', 'orders section'),
              'settings': extract(r'<section id="settings"\b.*?</section>', 'settings section'),
              'client-logs': extract(r'<section id="clientLogs"\b.*?</section>', 'client logs section'),
              'server-logs': extract(r'<section id="logs"\b.*?</section>', 'server logs section'),
              'update': extract(r'<section id="update"\b.*?</section>', 'update section'),
          }
          page_meta = {
              'overview': ('总览', '/admin/overview', 'admin.html'),
              'users': ('用户', '/admin/users', 'admin-users.html'),
              'plans': ('会员', '/admin/plans', 'admin-plans.html'),
              'orders': ('订单', '/admin/orders', 'admin-orders.html'),
              'settings': ('系统配置', '/admin/settings', 'admin-settings.html'),
              'client-logs': ('客户端运行日志', '/admin/client-logs', 'admin-client-logs.html'),
              'server-logs': ('服务端日志', '/admin/server-logs', 'admin-server-logs.html'),
              'update': ('更新', '/admin/update', 'admin-update.html'),
          }
          nav_order = list(page_meta)

          def make_page(page):
              title, _, filename = page_meta[page]
              links = []
              for key in nav_order:
                  label, href, _ = page_meta[key]
                  cls = ' class="active" aria-current="page"' if key == page else ''
                  links.append(f'<a href="{href}" data-page="{key}"{cls}>{label}</a>')
              nav = ''.join(links)
              extra_dialog = f'\n{dialog}' if page == 'users' else ''
              extra_script = '\n<script type="module" src="/client-runtime-admin.js"></script>' if page == 'client-logs' else ''
              return f'''<!doctype html>\n<html lang="zh-CN">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>GPTLock 管理 · {title}</title>\n  <link rel="stylesheet" href="/admin.css">\n</head>\n<body data-admin-page="{page}">\n<div class="shell">\n  <aside class="sidebar">\n    <div class="brand"><span>G</span><div><strong>GPTLock</strong><small>Control Center</small></div></div>\n    <nav>{nav}</nav>\n    <button id="logout" class="ghost" hidden>退出管理员</button>\n  </aside>\n  <main class="workspace">\n    <header class="topbar"><div><p>GPTLOCK ADMIN · {page.upper()}</p><h1>{title}</h1></div><span class="security-pill">Account Control</span></header>\n    {login}\n    <div id="app" hidden>\n      {sections[page]}\n    </div>\n  </main>\n</div>{extra_dialog}\n<script type="module" src="/admin.js"></script>{extra_script}\n</body>\n</html>\n'''

          for page, (_, _, filename) in page_meta.items():
              write(f'license-server/public/{filename}', make_page(page))

          admin_js = read('license-server/public/admin.js')
          admin_js = admin_js.replace("  createUserFreeDays: $('createUserFreeDays'), createUserDevices: $('createUserDevices'), createUserWindows: $('createUserWindows'),\n", "  createUserFreeDays: $('createUserFreeDays'), createUserDevices: $('createUserDevices'),\n")
          admin_js = admin_js.replace("  freeDays: $('freeDays'), freeDevices: $('freeDevices'), freeWindows: $('freeWindows'), sessionDays: $('sessionDays'),\n", "  freeDays: $('freeDays'), freeDevices: $('freeDevices'), sessionDays: $('sessionDays'),\n")
          admin_js = admin_js.replace("    maxWindowsOverride: optionalPositiveInt(el.createUserWindows, '窗口上限'),\n", '')
          admin_js = admin_js.replace("    maxWindowsOverride: optionalPositiveInt(controls.windows, '窗口上限'),\n", "    maxWindowsOverride: row.overrides?.windows ?? null,\n")
          window_block = '''    const windowsCell = document.createElement('td'); const windowsWrap = document.createElement('div'); windowsWrap.className = 'limit-editor';\n    const windows = inputControl('number', row.overrides?.windows ?? '', { min: 1, max: 1000, placeholder: '默认' });\n    const windowsUsage = document.createElement('small'); windowsUsage.textContent = `已用 ${row.entitlement?.usage?.windows ?? 0} / 生效 ${row.entitlement?.limits?.windows ?? 0}`;\n    windowsWrap.append(windows, windowsUsage); windowsCell.append(windowsWrap); tr.append(windowsCell);\n\n'''
          if window_block not in admin_js:
              raise SystemExit('admin.js window editor block missing')
          admin_js = admin_js.replace(window_block, '', 1)
          admin_js = admin_js.replace('void saveUserRow(row, { email, status, devices, windows, expiry }, rowMessage)', 'void saveUserRow(row, { email, status, devices, expiry }, rowMessage)')
          admin_js = admin_js.replace("cell.colSpan = 8;", "cell.colSpan = 7;", 1)
          admin_js = admin_js.replace("  const windows = makeField('窗口上限', plan.limits.windows, 1);\n", '')
          admin_js = admin_js.replace('maxDevices: Number(devices.value), maxWindows: Number(windows.value),', 'maxDevices: Number(devices.value), maxWindows: plan.limits.windows,')
          admin_js = admin_js.replace("  el.freeWindows.value = settings.free?.maxWindows ?? 1;\n", '')
          admin_js = admin_js.replace("  if (!el.createUserFreeDays.value) el.createUserFreeDays.value = settings.free?.days ?? 7;", "  if (el.createUserFreeDays && !el.createUserFreeDays.value) el.createUserFreeDays.value = settings.free?.days ?? 7;")
          admin_js = admin_js.replace("    free: { days: Number(el.freeDays.value), maxDevices: Number(el.freeDevices.value), maxWindows: Number(el.freeWindows.value) },", "    free: { days: Number(el.freeDays.value), maxDevices: Number(el.freeDevices.value) },")
          admin_js = admin_js.replace('  el.createUserWindows.value = \'\';\n', '')

          # Cross-page operations should refresh only the page that owns the changed data.
          admin_js = admin_js.replace('await Promise.all([loadUsers(), loadDashboard()]);', 'await loadUsers();')
          admin_js = admin_js.replace('await Promise.all([loadOrders(), loadUsers(), loadDashboard()]);', 'await loadOrders();')
          admin_js = admin_js.replace('await Promise.all([loadOrders(), loadDashboard()]);', 'await loadOrders();')

          old = '''function renderPlans(plans) {\n  plansCache = plans;\n  el.planCards.textContent = '';\n  for (const plan of plans) el.planCards.append(planCard(plan));\n}'''
          new = '''function renderPlans(plans) {\n  plansCache = plans;\n  if (!el.planCards) return;\n  el.planCards.textContent = '';\n  for (const plan of plans) el.planCards.append(planCard(plan));\n}'''
          admin_js = replace_once(admin_js, old, new, 'admin renderPlans')

          old = '''async function loadAll() {\n  try {\n    await loadDashboard();\n    el.login.hidden = true; el.app.hidden = false; el.logout.hidden = false;\n    await loadPlans();\n    await Promise.all([loadUsers(), loadOrders(), loadSettings(), loadRuntimeLogs(), loadAudit(), loadUpdate()]);\n    startUpdatePolling();\n  } catch (error) {\n    if (error.status === 401) {\n      stopUpdatePolling(); el.app.hidden = true; el.login.hidden = false; el.logout.hidden = true;\n    } else if (!el.app.hidden) {\n      setMessage(el.loginMessage, error.message, 'bad');\n    }\n  }\n}'''
          new = '''async function loadAll() {\n  try {\n    const page = document.body.dataset.adminPage || 'overview';\n    const dashboard = await api('/admin/api/account/dashboard');\n    el.login.hidden = true; el.app.hidden = false; el.logout.hidden = false;\n    if (page === 'overview') renderDashboard(dashboard);\n    else if (page === 'users') { await loadPlans(); await loadUsers(); }\n    else if (page === 'plans') await loadPlans();\n    else if (page === 'orders') await loadOrders();\n    else if (page === 'settings') await loadSettings();\n    else if (page === 'server-logs') await Promise.all([loadRuntimeLogs(), loadAudit()]);\n    else if (page === 'update') { await loadUpdate(); startUpdatePolling(); }\n    // client-logs is loaded by client-runtime-admin.js after #app becomes visible.\n  } catch (error) {\n    if (error.status === 401) {\n      stopUpdatePolling(); el.app.hidden = true; el.login.hidden = false; el.logout.hidden = true;\n    } else if (!el.app.hidden) {\n      setMessage(el.loginMessage, error.message, 'bad');\n    }\n  }\n}'''
          admin_js = replace_once(admin_js, old, new, 'admin loadAll')

          # Page-specific controls do not exist on other independent pages.
          listener_names = [
              'refreshUsers','userSearch','createUserToggle','cancelCreateUser','generateUserPassword','createUserSubmit',
              'userPasswordClose','userPasswordCancel','userPasswordDialog','userPasswordSubmit','userPasswordConfirm',
              'refreshOrders','saveSettings','sendTestEmail','refreshRuntime','exportRuntime','updateButton'
          ]
          for name in listener_names:
              admin_js = admin_js.replace(f'el.{name}.addEventListener', f'el.{name}?.addEventListener')
          write('license-server/public/admin.js', admin_js)

          css = read('license-server/public/admin.css')
          css += '\n.sidebar nav a.active,.sidebar nav a[aria-current="page"]{background:#2563eb;color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.22)}\nbody[data-admin-page] #app>.card,body[data-admin-page] #app>.stats-grid{margin-top:0}\n'
          write('license-server/public/admin.css', css)

          server = read('license-server/server.mjs')
          old = '''    if (url.pathname === '/' || url.pathname === '/admin' || url.pathname === '/admin/') return staticFile(res, join(PUBLIC, 'admin.html'));\n    if (url.pathname === '/admin.js') return staticFile(res, join(PUBLIC, 'admin.js'));'''
          new = '''    const adminPage = ({\n      '/': 'admin.html',\n      '/admin': 'admin.html',\n      '/admin/': 'admin.html',\n      '/admin/overview': 'admin.html',\n      '/admin/users': 'admin-users.html',\n      '/admin/plans': 'admin-plans.html',\n      '/admin/orders': 'admin-orders.html',\n      '/admin/settings': 'admin-settings.html',\n      '/admin/client-logs': 'admin-client-logs.html',\n      '/admin/server-logs': 'admin-server-logs.html',\n      '/admin/update': 'admin-update.html',\n    })[url.pathname];\n    if (adminPage) return staticFile(res, join(PUBLIC, adminPage));\n    if (url.pathname === '/admin.js') return staticFile(res, join(PUBLIC, 'admin.js'));'''
          server = replace_once(server, old, new, 'server admin page routing')
          write('license-server/server.mjs', server)

          # ---- Tests: make the regression executable ----
          license_ui = read('extension/tests/license-ui-config.test.mjs')
          license_ui = license_ui.replace("  assert.equal(manifest.action.default_popup, 'popup-v0513.html');", "  assert.equal(manifest.action.default_popup, 'popup-v0513.html');\n  assert.equal(manifest.options_ui.page, 'settings-v0517.html');")
          license_ui = license_ui.replace("  assert.match(shell, /options\\.html#updates-auto/);", "  assert.match(shell, /settings-v0517\\.html#updates-auto/);")
          write('extension/tests/license-ui-config.test.mjs', license_ui)

          update_test = read('extension/tests/popup-update-center.test.mjs')
          update_test = update_test.replace("const optionsHtml = new URL('../options.html', import.meta.url);\n", '')
          update_test = update_test.replace("  const [html, js] = await Promise.all([readFile(optionsHtml, 'utf8'), readFile(optionsUpdate, 'utf8')]);", "  const manifest = JSON.parse(await readFile(manifestUrl, 'utf8'));\n  const settingsHtml = new URL(`../${manifest.options_ui.page}`, import.meta.url);\n  const [html, js] = await Promise.all([readFile(settingsHtml, 'utf8'), readFile(optionsUpdate, 'utf8')]);")
          write('extension/tests/popup-update-center.test.mjs', update_test)

          smoke = read('license-server/test/smoke.test.mjs')
          old = '''    const adminHtml = await readFile(new URL('../public/admin.html', import.meta.url), 'utf8');\n    const adminJs = await readFile(new URL('../public/admin.js', import.meta.url), 'utf8');\n    assert.match(adminHtml, /id="emailVerificationRequired"/);\n    assert.match(adminHtml, /id="createUserToggle"/);\n    assert.match(adminHtml, /id="createUserPanel"/);\n    assert.match(adminHtml, /id="userPasswordDialog"/);'''
          new = '''    const adminHtml = await readFile(new URL('../public/admin.html', import.meta.url), 'utf8');\n    const adminUsersHtml = await readFile(new URL('../public/admin-users.html', import.meta.url), 'utf8');\n    const adminSettingsHtml = await readFile(new URL('../public/admin-settings.html', import.meta.url), 'utf8');\n    const adminJs = await readFile(new URL('../public/admin.js', import.meta.url), 'utf8');\n    assert.match(adminHtml, /data-admin-page="overview"/);\n    assert.doesNotMatch(adminHtml, /id="users"/);\n    assert.match(adminUsersHtml, /id="createUserToggle"/);\n    assert.match(adminUsersHtml, /id="createUserPanel"/);\n    assert.match(adminUsersHtml, /id="userPasswordDialog"/);\n    assert.doesNotMatch(adminUsersHtml, /窗口上限/);\n    assert.match(adminSettingsHtml, /id="emailVerificationRequired"/);\n    assert.doesNotMatch(adminSettingsHtml, /同时窗口上限/);'''
          smoke = replace_once(smoke, old, new, 'smoke admin HTML assertions')
          smoke = smoke.replace('// First device logs in and free tier allows only one simultaneous Chrome window.', '// First device logs in; account entitlement is required but concurrent Chrome windows are unlimited.')
          smoke = replace_once(smoke,
              "    assert.deepEqual(heartbeat.data.allowedWindowKeys, ['chrome:10000001']);\n    assert.deepEqual(heartbeat.data.deniedWindowKeys, ['chrome:10000002']);\n    assert.equal(heartbeat.data.account.entitlement.usage.windows, 1);",
              "    assert.deepEqual(heartbeat.data.allowedWindowKeys, ['chrome:10000001', 'chrome:10000002']);\n    assert.deepEqual(heartbeat.data.deniedWindowKeys, []);\n    assert.equal(heartbeat.data.account.entitlement.usage.windows, 2);",
              'smoke unlimited windows assertions')
          write('license-server/test/smoke.test.mjs', smoke)

          write('extension/tests/window-quota-removal.test.mjs', '''import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\ntest('legacy License cannot become active and window count cannot gate GPTLock', async () => {\n  const [background, auth, accountSystem, manifestText, settings] = await Promise.all([\n    readFile(new URL('../background.js', import.meta.url), 'utf8'),\n    readFile(new URL('../auth-gate.js', import.meta.url), 'utf8'),\n    readFile(new URL('../../license-server/account-system.mjs', import.meta.url), 'utf8'),\n    readFile(new URL('../manifest.json', import.meta.url), 'utf8'),\n    readFile(new URL('../settings-v0517.html', import.meta.url), 'utf8'),\n  ]);\n  const manifest = JSON.parse(manifestText);\n  assert.equal(manifest.options_ui.page, 'settings-v0517.html');\n  assert.doesNotMatch(settings, /授权验证 \\/ License|id="licenseCode"|GPTL-/);\n  const gate = background.match(/function accountAllowsState\\([^)]*\\) \\{[\\s\\S]*?\\n\\}/)?.[0] || '';\n  assert.match(gate, /authenticated/);\n  assert.doesNotMatch(gate, /allowedWindowKeys|windowId|deniedWindowKeys/);\n  assert.match(background, /authorized: false,[\\s\\S]*status: 'removed',[\\s\\S]*license: null/);\n  assert.doesNotMatch(background, /当前窗口已超过同时窗口上限/);\n  assert.doesNotMatch(auth, /!windowAccess|当前窗口超过账户同时窗口上限/);\n  assert.match(accountSystem, /const allowed = entitlement\\.active \\? requested : \\[\\];/);\n  assert.doesNotMatch(accountSystem, /entitlement\\.limits\\.windows - otherCount/);\n});\n''')

          write('extension/tests/admin-pages.test.mjs', '''import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst pages = {\n  overview: ['admin.html', 'overview'],\n  users: ['admin-users.html', 'users'],\n  plans: ['admin-plans.html', 'plans'],\n  orders: ['admin-orders.html', 'orders'],\n  settings: ['admin-settings.html', 'settings'],\n  'client-logs': ['admin-client-logs.html', 'clientLogs'],\n  'server-logs': ['admin-server-logs.html', 'logs'],\n  update: ['admin-update.html', 'update'],\n};\n\ntest('server admin navigation uses independent route-backed pages', async () => {\n  const ids = Object.values(pages).map(([, id]) => id);\n  for (const [page, [file, id]] of Object.entries(pages)) {\n    const html = await readFile(new URL(`../../license-server/public/${file}`, import.meta.url), 'utf8');\n    assert.match(html, new RegExp(`data-admin-page="${page}"`));\n    assert.match(html, new RegExp(`id="${id}"`));\n    for (const other of ids) if (other !== id) assert.doesNotMatch(html, new RegExp(`id="${other}"`));\n    for (const route of ['/admin/overview','/admin/users','/admin/plans','/admin/orders','/admin/settings','/admin/client-logs','/admin/server-logs','/admin/update']) assert.match(html, new RegExp(`href="${route}"`));\n  }\n  const server = await readFile(new URL('../../license-server/server.mjs', import.meta.url), 'utf8');\n  for (const route of ['/admin/users','/admin/plans','/admin/orders','/admin/settings','/admin/client-logs','/admin/server-logs','/admin/update']) assert.match(server, new RegExp(route.replaceAll('/', '\\\\/')));\n});\n''')
          PY

          cargo check --manifest-path native-core/Cargo.toml
          npm test --prefix extension
          cargo check --locked --manifest-path native-core/Cargo.toml
          git diff --check

      - name: Commit finalized implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v0517-window-quota-admin-pages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: remove window quota and split admin pages'
          git push origin HEAD
