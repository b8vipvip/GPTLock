name: temp-context-profile-migration
on:
  push:
    branches:
      - refactor/private-context-profile-learning-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/private-context-profile-learning-v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply private profile migration
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f private-engine/src/context_profile.rs; then
            echo 'migration already applied'
            exit 0
          fi
          python .github/scripts/tmp_context_profile_migration.py
          cargo fmt --manifest-path native-core/Cargo.toml --all
          cargo fmt --manifest-path private-engine/Cargo.toml --all
          cargo test --manifest-path private-engine/Cargo.toml --all-targets
          cargo test --manifest-path native-core/Cargo.toml --all-targets
          node --check extension/private-core-channel.js
          node --check extension/private-context-bridge.js
          node --check extension/context-budget.js
          node --test \
            extension/tests/private-context-bridge.test.mjs \
            extension/tests/private-core-channel-capability.test.mjs \
            extension/tests/private-context-profile-integration.test.mjs
      - name: Commit migrated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            private-engine/src/context_profile.rs \
            private-engine/src/context_budget.rs \
            private-engine/src/main.rs \
            native-core/src/private_engine.rs \
            extension/private-core-channel.js \
            extension/private-context-bridge.js \
            extension/context-budget.js \
            extension/tests/private-context-bridge.test.mjs \
            extension/tests/private-core-channel-capability.test.mjs \
            extension/tests/private-context-profile-integration.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(context): move profile learning math private'
          git push origin HEAD:refactor/private-context-profile-learning-v1
