name: Apply adaptive context tree patch

on:
  push:
    branches:
      - feat/adaptive-context-learning
    paths:
      - .github/workflows/adaptive-context-tree-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-context-learning
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch full conversation-tree accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('extension/context-budget.js')
          text = path.read_text(encoding='utf-8')

          old = """  const ACCOUNT_FETCH_TIMEOUT_MS = 4_000;\n  const LEARNING_HEADROOM_RATIO = 0.06;"""
          new = """  const ACCOUNT_FETCH_TIMEOUT_MS = 4_000;\n  const CONVERSATION_FETCH_TIMEOUT_MS = 5_000;\n  const CONVERSATION_METRICS_REFRESH_MS = 5_000;\n  const CONVERSATION_METRICS_MAX_AGE_MS = 30_000;\n  const LEARNING_HEADROOM_RATIO = 0.06;"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  let lastLoadedProfileModel = null;\n\n  function normalizeModelId(value) {"""
          new = """  let lastLoadedProfileModel = null;\n  let conversationMetricsCache = null;\n  let conversationMetricsCheckedAt = 0;\n  let conversationMetricsPromise = null;\n\n  function normalizeModelId(value) {"""
          assert old in text
          text = text.replace(old, new, 1)

          anchor = """  function profileStorageKey(accountScope, model) {"""
          insertion = r'''  function conversationMessageText(message) {
    const content = message?.content;
    if (!content || typeof content !== 'object') return '';
    const pieces = [];
    const append = (value) => {
      if (typeof value === 'string' && value) pieces.push(value);
    };
    if (Array.isArray(content.parts)) {
      for (const part of content.parts) {
        if (typeof part === 'string') append(part);
        else if (part && typeof part === 'object') {
          append(part.text);
          append(part.content);
          append(part.result);
          append(part.output);
        }
      }
    }
    append(content.text);
    append(content.result);
    append(content.output);
    return pieces.join('\n');
  }

  function conversationMessageMediaCounts(message) {
    const content = message?.content;
    let images = 0;
    let attachments = 0;
    if (content && typeof content === 'object' && Array.isArray(content.parts)) {
      for (const part of content.parts) {
        if (!part || typeof part !== 'object') continue;
        const kind = String(part.content_type || part.type || '').toLowerCase();
        if (part.asset_pointer || kind.includes('image')) images += 1;
        else if (kind.includes('file') || kind.includes('attachment')) attachments += 1;
      }
    }
    const metadataAttachments = message?.metadata?.attachments;
    if (Array.isArray(metadataAttachments)) attachments += metadataAttachments.length;
    return {
      images: Math.min(32, images),
      attachments: Math.min(32, attachments),
    };
  }

  function activeConversationMessages(payload) {
    const mapping = payload?.mapping;
    let cursor = String(payload?.current_node || '').trim();
    if (!mapping || typeof mapping !== 'object' || !cursor) return [];
    const reversed = [];
    const seen = new Set();
    while (cursor && !seen.has(cursor)) {
      seen.add(cursor);
      const node = mapping[cursor];
      if (!node || typeof node !== 'object') break;
      if (node.message && typeof node.message === 'object') reversed.push(node.message);
      cursor = String(node.parent || '').trim();
    }
    return reversed.reverse();
  }

  function extractConversationMetrics(payload) {
    const messages = activeConversationMessages(payload);
    if (!messages.length) return null;
    let tokens = 0;
    let characters = 0;
    let countedMessages = 0;
    for (const message of messages) {
      const text = conversationMessageText(message);
      const media = conversationMessageMediaCounts(message);
      if (!text && media.images === 0 && media.attachments === 0) continue;
      characters += text.length;
      tokens += estimateTextTokens(text)
        + (media.images * IMAGE_TOKEN_ESTIMATE)
        + (media.attachments * ATTACHMENT_TOKEN_ESTIMATE)
        + MESSAGE_OVERHEAD_TOKENS;
      countedMessages += 1;
    }
    if (!countedMessages) return null;
    return {
      tokens: Math.max(0, Math.ceil(tokens)),
      characters: Math.max(0, Math.ceil(characters)),
      messageCount: countedMessages,
    };
  }

'''
          assert anchor in text
          text = text.replace(anchor, insertion + anchor, 1)

          old = """    nextLearnedProfile,\n    snapshot: () => lastSnapshot,"""
          new = """    nextLearnedProfile,\n    extractConversationMetrics,\n    snapshot: () => lastSnapshot,"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  function currentConversationKey() {\n    try {\n      const url = new URL(location.href);\n      const conversation = url.pathname.match(/(?:^|\\/)c\\/([a-zA-Z0-9_-]+)/);\n      return conversation ? `conversation:${conversation[1]}` : `page:${url.pathname}`;\n    } catch {\n      return 'unknown';\n    }\n  }\n"""
          new = """  function currentConversationId() {\n    try {\n      return new URL(location.href).pathname.match(/(?:^|\\/)c\\/([a-zA-Z0-9_-]+)/)?.[1] || null;\n    } catch {\n      return null;\n    }\n  }\n\n  function currentConversationKey() {\n    try {\n      const url = new URL(location.href);\n      const conversationId = currentConversationId();\n      return conversationId ? `conversation:${conversationId}` : `page:${url.pathname}`;\n    } catch {\n      return 'unknown';\n    }\n  }\n\n  async function fetchConversationMetrics(conversationId) {\n    if (!conversationId) return null;\n    const controller = new AbortController();\n    const timer = window.setTimeout(() => controller.abort(), CONVERSATION_FETCH_TIMEOUT_MS);\n    try {\n      const response = await fetch(`/backend-api/conversation/${encodeURIComponent(conversationId)}`, {\n        method: 'GET',\n        credentials: 'include',\n        cache: 'no-store',\n        headers: { accept: 'application/json' },\n        signal: controller.signal,\n      });\n      if (!response.ok) return null;\n      const payload = await response.json();\n      return extractConversationMetrics(payload);\n    } catch {\n      return null;\n    } finally {\n      window.clearTimeout(timer);\n    }\n  }\n\n  async function refreshConversationMetrics(force = false) {\n    const conversationId = currentConversationId();\n    const conversationKey = currentConversationKey();\n    if (!conversationId) {\n      conversationMetricsCache = null;\n      conversationMetricsCheckedAt = Date.now();\n      return null;\n    }\n    const now = Date.now();\n    if (\n      !force\n      && conversationMetricsCache?.conversationKey === conversationKey\n      && now - conversationMetricsCheckedAt < CONVERSATION_METRICS_REFRESH_MS\n    ) return conversationMetricsCache;\n    if (conversationMetricsPromise) return conversationMetricsPromise;\n    conversationMetricsPromise = (async () => {\n      const metrics = await fetchConversationMetrics(conversationId);\n      conversationMetricsCheckedAt = Date.now();\n      if (metrics && currentConversationKey() === conversationKey) {\n        conversationMetricsCache = { ...metrics, conversationKey, measuredAt: new Date().toISOString() };\n        scheduleRefresh();\n      }\n      return conversationMetricsCache;\n    })().finally(() => {\n      conversationMetricsPromise = null;\n    });\n    return conversationMetricsPromise;\n  }\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  function snapshotNow() {\n    const messages = conversationElements();\n    const history = messages.reduce((total, element) => {\n      const metrics = elementMetrics(element);\n      total.tokens += metrics.tokens;\n      total.characters += metrics.characters;\n      return total;\n    }, { tokens: 0, characters: 0 });\n    const composer = findComposer();"""
          new = """  function snapshotNow() {\n    const messages = conversationElements();\n    const domHistory = messages.reduce((total, element) => {\n      const metrics = elementMetrics(element);\n      total.tokens += metrics.tokens;\n      total.characters += metrics.characters;\n      return total;\n    }, { tokens: 0, characters: 0 });\n    const cacheFresh = Boolean(\n      conversationMetricsCache\n      && conversationMetricsCache.conversationKey === currentConversationKey()\n      && Date.now() - conversationMetricsCheckedAt <= CONVERSATION_METRICS_MAX_AGE_MS\n    );\n    const history = cacheFresh ? {\n      tokens: Math.max(domHistory.tokens, conversationMetricsCache.tokens),\n      characters: Math.max(domHistory.characters, conversationMetricsCache.characters),\n    } : domHistory;\n    const historyMessageCount = cacheFresh\n      ? Math.max(messages.length, conversationMetricsCache.messageCount)\n      : messages.length;\n    const composer = findComposer();"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """      messageCount: messages.length,\n      historyCharacters: history.characters,"""
          new = """      messageCount: historyMessageCount,\n      historyCharacters: history.characters,\n      historyMeasurementSource: cacheFresh ? 'conversation-tree+dom-reconcile' : 'dom-fallback',"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """      `当前完整聊天：约 ${formatCompactTokens(snapshot.fullConversationTokens)} tokens · ${formatCompactNumber(snapshot.fullConversationCharacters)} 字符 · ${snapshot.messageCount} 条消息`,"""
          new = """      `当前完整聊天：约 ${formatCompactTokens(snapshot.fullConversationTokens)} tokens · ${formatCompactNumber(snapshot.fullConversationCharacters)} 字符 · ${snapshot.messageCount} 条消息 · ${snapshot.historyMeasurementSource === 'conversation-tree+dom-reconcile' ? '完整活动分支' : 'DOM 回退'}`,"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """      '说明：插件统计当前页面完整聊天内容并做本地 token 估算；ChatGPT 隐藏系统提示、工具上下文、服务端压缩/裁剪和精确 tokenizer 不对扩展完整开放，因此“实测成功下限”代表该可见聊天长度下服务仍成功生成，不等同于官方物理上下文窗口。',"""
          new = """      '说明：插件优先读取当前会话 conversation tree 并沿 current_node 活动分支统计，再与 DOM 新内容取较大值；读取失败时退回 DOM。ChatGPT 隐藏系统提示、服务端压缩/裁剪和精确 tokenizer 仍不对扩展完整开放，因此“实测成功下限”代表该活动会话长度下服务仍成功生成，不等同于官方物理上下文窗口。',"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  function recompute() {\n    refreshTimer = null;\n    try {\n      publishSnapshot(snapshotNow());\n      void maybeFinalizeBypassLearning();"""
          new = """  function recompute() {\n    refreshTimer = null;\n    try {\n      publishSnapshot(snapshotNow());\n      void refreshConversationMetrics();\n      void maybeFinalizeBypassLearning();"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    const confirmedConversationTokens = Math.max(\n      Math.ceil(postSnapshot.historyTokens || 0),\n      Math.ceil(pendingBypass.preSnapshot?.usedTokens || 0),\n    );"""
          new = """    // A successful answer proves the input accepted at send time, not the answer-inclusive post state.\n    const confirmedConversationTokens = Math.ceil(pendingBypass.preSnapshot?.usedTokens || 0);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        confirmedCharacters: postSnapshot.historyCharacters,"""
          new = """        confirmedCharacters: pendingBypass.preSnapshot?.fullConversationCharacters || 0,"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    recomputeSnapshotOnly();\n    const postSnapshot = lastSnapshot;"""
          new = """    await refreshConversationMetrics(true);\n    recomputeSnapshotOnly();\n    const postSnapshot = lastSnapshot;"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  window.addEventListener('popstate', () => {\n    pendingBypass = null;\n    scheduleRefresh();\n    void refreshAccountScope();\n  });\n  window.addEventListener('hashchange', () => {\n    pendingBypass = null;\n    scheduleRefresh();\n    void refreshAccountScope();\n  });"""
          new = """  function handleConversationNavigation() {\n    pendingBypass = null;\n    conversationMetricsCache = null;\n    conversationMetricsCheckedAt = 0;\n    scheduleRefresh();\n    void refreshAccountScope(true);\n    void refreshConversationMetrics(true);\n  }\n  window.addEventListener('popstate', handleConversationNavigation);\n  window.addEventListener('hashchange', handleConversationNavigation);"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  document.addEventListener('visibilitychange', () => {\n    if (document.visibilityState === 'visible') void refreshAccountScope();\n  });\n  window.setInterval(recompute, PERIODIC_REFRESH_MS);\n  void refreshAccountScope(true);\n  recompute();"""
          new = """  document.addEventListener('visibilitychange', () => {\n    if (document.visibilityState === 'visible') {\n      void refreshAccountScope(true);\n      void refreshConversationMetrics(true);\n    }\n  });\n  window.setInterval(recompute, PERIODIC_REFRESH_MS);\n  void refreshAccountScope(true);\n  void refreshConversationMetrics(true);\n  recompute();"""
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('extension/tests/context-budget.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          tests += r'''

test('full conversation metrics follow only the active current_node branch instead of counting abandoned forks', () => {
  const payload = {
    current_node: 'a2',
    mapping: {
      root: { parent: null, children: ['u1'], message: null },
      u1: {
        parent: 'root', children: ['a1', 'fork'],
        message: { author: { role: 'user' }, content: { parts: ['hello active branch'] }, metadata: {} },
      },
      a1: {
        parent: 'u1', children: ['a2'],
        message: { author: { role: 'assistant' }, content: { parts: ['active answer'] }, metadata: {} },
      },
      a2: {
        parent: 'a1', children: [],
        message: { author: { role: 'user' }, content: { parts: ['latest user turn'] }, metadata: {} },
      },
      fork: {
        parent: 'u1', children: [],
        message: { author: { role: 'assistant' }, content: { parts: ['x'.repeat(100_000)] }, metadata: {} },
      },
    },
  };
  const metrics = budget.extractConversationMetrics(payload);
  assert.equal(metrics.messageCount, 3);
  assert.ok(metrics.characters < 1_000);
  assert.ok(metrics.tokens > 10);
});
'''
          test_path.write_text(tests, encoding='utf-8')
          PY

          node --check extension/context-budget.js
          node --test extension/tests/context-budget.test.mjs

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/context-budget.js extension/tests/context-budget.test.mjs
          git diff --cached --exit-code && { echo 'Patch made no changes'; exit 1; } || true
          git commit -m 'feat: reconcile context length with full conversation tree'
          git push origin HEAD:feat/adaptive-context-learning
