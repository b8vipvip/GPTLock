name: Apply adaptive context tree patch

on:
  push:
    branches:
      - feat/adaptive-context-learning
    paths:
      - .github/workflows/adaptive-context-tree-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-context-learning
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python tools/patch-adaptive-context.py
      - name: Validate
        run: |
          node --check extension/context-budget.js
          node --test extension/tests/context-budget.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/context-budget.js extension/tests/context-budget.test.mjs
          if git diff --cached --quiet; then
            echo 'Patch made no changes'
            exit 1
          fi
          git commit -m 'feat: reconcile context length with full conversation tree'
          git push origin HEAD:feat/adaptive-context-learning
