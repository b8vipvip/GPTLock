name: temp-bump-release-0529

on:
  push:
    branches:
      - release/v0.5.29

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare v0.5.29 metadata
        run: python .github/scripts/tmp_bump_release_0529.py
      - name: Validate extension
        working-directory: extension
        run: npm test
      - name: Validate native core
        run: |
          cargo fmt --manifest-path native-core/Cargo.toml --all -- --check
          cargo test --locked --manifest-path native-core/Cargo.toml
      - name: Validate private engine
        run: |
          cargo fmt --manifest-path private-engine/Cargo.toml --all -- --check
          cargo test --locked --manifest-path private-engine/Cargo.toml
      - name: Commit release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Release metadata is already at v0.5.29.'
            exit 0
          fi
          git commit -m 'release: v0.5.29 [skip-release-bump]'
          git push
