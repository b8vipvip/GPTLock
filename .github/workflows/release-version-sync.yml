name: Finalize v0.5.23 version sync

on:
  push:
    branches:
      - chore/release-v0523-auto-update-test

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[version-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/release-v0523-auto-update-test
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock and remove finalizer
        run: |
          cargo check --manifest-path native-core/Cargo.toml
          git rm .github/workflows/release-version-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock
          git commit -m "chore: finalize v0.5.23 version sync [version-sync]"
          git push origin HEAD:chore/release-v0523-auto-update-test
