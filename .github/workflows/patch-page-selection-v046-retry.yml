name: Retry page selection v0.4.6 patch

on:
  push:
    branches:
      - fix/page-selection-sync-v046
    paths:
      - .github/workflows/patch-page-selection-v046-retry.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page-selection-sync-v046
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_page_selection_v046.py
      - name: Refresh Cargo.lock
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Run extension tests
        working-directory: extension
        run: npm test
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension native-core/Cargo.toml native-core/Cargo.lock
          git commit -m 'fix: synchronize live page model evidence'
          git push origin HEAD:fix/page-selection-sync-v046
