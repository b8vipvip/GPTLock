name: temp-run-release-migration
on:
  push:
    branches:
      - build/monorepo-private-engine-release-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/monorepo-private-engine-release-v1
      - name: Generate migrated release workflow
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/tmp_migrate_release_monorepo.py
          cp .github/workflows/release.yml .github/release.generated.yml
          git checkout -- .github/workflows/release.yml
      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release.generated.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(release): generate monorepo release workflow"
          git push origin HEAD:build/monorepo-private-engine-release-v1
