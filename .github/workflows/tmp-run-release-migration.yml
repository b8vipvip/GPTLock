name: temp-run-release-migration
on:
  push:
    branches:
      - build/monorepo-private-engine-release-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/monorepo-private-engine-release-v1
      - name: Apply migration
        run: python .github/scripts/tmp_migrate_release_monorepo.py
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-run-release-migration.yml
          rm .github/scripts/tmp_migrate_release_monorepo.py
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release.yml .github/workflows/tmp-run-release-migration.yml .github/scripts/tmp_migrate_release_monorepo.py
          git commit -m "build(release): compile private engine in monorepo"
          git push origin HEAD:build/monorepo-private-engine-release-v1
