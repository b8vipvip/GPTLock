name: Finalize silent updater v0.5.18

on:
  push:
    branches: [fix/automatic-silent-updater-v0518]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automatic-silent-updater-v0518
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile and format
        run: |
          cargo fmt --manifest-path native-core/Cargo.toml --all
          cargo check --manifest-path native-core/Cargo.toml
      - name: Run regression tests
        run: |
          npm test --prefix extension
          cargo check --locked --manifest-path native-core/Cargo.toml
          cargo test --locked --manifest-path native-core/Cargo.toml --all-targets
          git diff --check
      - name: Commit generated lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/finalize-silent-updater-v0518.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock native-core/src/updater.rs .github/workflows/finalize-silent-updater-v0518.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize v0.5.18 silent updater"
          git push origin HEAD:fix/automatic-silent-updater-v0518
