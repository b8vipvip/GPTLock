name: temp-release-monorepo
on:
  push:
    branches:
      - build/monorepo-private-engine-release-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/monorepo-private-engine-release-v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Migrate release workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/release.yml')
          s = p.read_text()
          ls = s.index('  linux:\n')
          ws = s.index('  windows:\n')
          ps = s.index('  publish:\n')
          linux = s[ls:ws]
          windows = s[ws:ps]

          cache = '          workspaces: native-core\n'
          cache2 = '          workspaces: |\n            native-core\n            private-engine\n'
          assert linux.count(cache) == 1
          assert windows.count(cache) == 1
          linux = linux.replace(cache, cache2, 1)
          windows = windows.replace(cache, cache2, 1)

          a = linux.index('      - name: Stage private engine when configured\n')
          b = linux.index('      - name: Build assets\n', a)
          linux_step = '''      - name: Build private engine from this commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --release --manifest-path private-engine/Cargo.toml
          engine="$GITHUB_WORKSPACE/private-engine/target/release/gptlock-private-engine"
          test -x "$engine"
          echo "GPTLOCK_PRIVATE_ENGINE=$engine" >> "$GITHUB_ENV"
          echo "GPTLOCK_REQUIRE_PRIVATE_ENGINE=1" >> "$GITHUB_ENV"
'''
          linux = linux[:a] + linux_step + linux[b:]

          a = windows.index('      - name: Stage private engine when configured\n')
          b = windows.index('      - name: Build Setup\n', a)
          windows_step = '''      - name: Build private engine from this commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path private-engine/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = (Resolve-Path 'private-engine\\target\\release\\gptlock-private-engine.exe').Path
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw 'Private engine build output is missing.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GPTLOCK_PRIVATE_ENGINE=$engine"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'GPTLOCK_REQUIRE_PRIVATE_ENGINE=1'
'''
          windows = windows[:a] + windows_step + windows[b:]

          linux_upload = '''      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
'''
          assert linux.count(linux_upload) == 1
          linux_check = '''      - name: Enforce Linux release distribution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          extension_zip="dist/gptlock-extension-${version}.zip"
          core_tar="dist/gptlock-core-${version}-linux-x64.tar.gz"
          deb="$(find dist -maxdepth 1 -type f -name 'gptlock_*_amd64.deb' -print -quit)"
          test -f "$extension_zip" && test -f "$core_tar" && test -f "$deb"
          if unzip -Z1 "$extension_zip" | grep -Eq '(^|/)(private-engine|Cargo\\.(toml|lock)|[^/]+\\.rs)(/|$)'; then
            echo 'Private engine source leaked into extension archive.' >&2
            exit 1
          fi
          entries="$(tar -tzf "$core_tar")"
          grep -qx 'gptlock-core' <<<"$entries"
          grep -qx 'gptlock-engine' <<<"$entries"
          if grep -Eq '(^|/)(private-engine|Cargo\\.(toml|lock)|[^/]+\\.rs)(/|$)' <<<"$entries"; then
            echo 'Private engine source leaked into Linux core archive.' >&2
            exit 1
          fi
          deb_entries="$(dpkg-deb --contents "$deb")"
          grep -q '/usr/bin/gptlock-engine$' <<<"$deb_entries"
          if grep -Eq 'private-engine|Cargo\\.(toml|lock)|\\.rs($|[[:space:]])' <<<"$deb_entries"; then
            echo 'Private engine source leaked into Linux deb.' >&2
            exit 1
          fi
'''
          linux = linux.replace(linux_upload, linux_check + linux_upload, 1)

          win_upload = '''      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
'''
          assert windows.count(win_upload) == 1
          win_check = '''      - name: Enforce Windows release distribution boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist\\windows\\GPTLockSetup-x64.exe').Path
          $root = Join-Path $env:RUNNER_TEMP 'GPTLock-Release-Boundary-Inspect'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$root"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($required in @(
            (Join-Path $root 'bin\\gptlock-core.exe'),
            (Join-Path $root 'bin\\gptlock-engine.exe'),
            (Join-Path $root 'extension\\manifest.json')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing release payload: $required" }
          }
          $leaks = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object {
            $_.Extension -eq '.rs' -or $_.Name -in @('Cargo.toml', 'Cargo.lock') -or $_.FullName -match '[\\\\/]private-engine[\\\\/]'
          })
          if ($leaks.Count -gt 0) { throw 'Private engine source leaked into Windows Setup.' }
'''
          windows = windows.replace(win_upload, win_check + win_upload, 1)

          out = s[:ls] + linux + windows + s[ps:]
          for marker in ('GPTLOCK_PRIVATE_CORE_REPOSITORY', 'GPTLOCK_PRIVATE_CORE_TOKEN', 'Stage private engine when configured', 'gh release download'):
              assert marker not in out, marker
          assert out.count('cargo build --release --manifest-path private-engine/Cargo.toml') >= 2
          assert out.count('GPTLOCK_REQUIRE_PRIVATE_ENGINE=1') >= 2
          p.write_text(out)
          PY
          rm .github/workflows/tmp-release-monorepo.yml
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release.yml .github/workflows/tmp-release-monorepo.yml
          git commit -m "build(release): compile private engine in monorepo"
          git push origin HEAD:build/monorepo-private-engine-release-v1
