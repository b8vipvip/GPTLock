name: Refresh Cargo.lock

on:
  push:
    branches:
      - codex/v0.3.4-request-lock-auto-verify

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile from Cargo metadata
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- native-core/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock
          git commit -m "chore: refresh Cargo.lock for 0.3.4"
          git push origin HEAD:codex/v0.3.4-request-lock-auto-verify
