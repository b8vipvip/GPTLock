name: Temporary GPTWork Workflow Candidate Generator

on:
  push:
    branches:
      - refactor/gptwork-unified-brand-20260903

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate workflow candidates outside workflow directory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tmp-gptwork-workflows.py
          git diff --check -- generated-workflows
      - name: Commit generated candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated-workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: generate GPTWork workflow migration candidates'
          git push origin HEAD:refactor/gptwork-unified-brand-20260903
