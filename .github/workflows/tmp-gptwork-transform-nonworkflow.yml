name: Temporary GPTWork Source Transformation

on:
  push:
    branches:
      - refactor/gptwork-unified-brand-20260903

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Transform non-workflow project sources
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 -c "import json; raise SystemExit(0 if json.load(open('extension/manifest.json'))['name']=='GPTWork' else 1)"; then
            echo 'GPTWork source transformation already applied.'
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          import json, re, subprocess

          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          binary = {'.png','.jpg','.jpeg','.gif','.ico','.exe','.deb','.gz','.zip'}
          pairs = [
            ('gptlock-private-engine','gptwork-private-engine'),
            ('gptlock_private_engine','gptwork_private_engine'),
            ('gptlock-license-server','gptwork-license-server'),
            ('gptlock-extension','gptwork-extension'),
            ('gptlock-core','gptwork-core'),
            ('gptlock_core','gptwork_core'),
            ('gptlock-engine','gptwork-engine'),
            ('gptlock-update','gptwork-update'),
            ('GptLock','GptWork'),
          ]
          for name in tracked:
            if not name or name.startswith('.github/workflows/'):
              continue
            p=Path(name)
            if p.suffix.lower() in binary:
              continue
            try: s=p.read_text(encoding='utf-8-sig')
            except (UnicodeDecodeError,OSError): continue
            old=s
            s=s.replace('GPTLock','GPTWork')
            s=re.sub(r'(?<![A-Za-z0-9_])GPTLOCK(?![A-Za-z0-9_-])','GPTWORK',s)
            for a,b in pairs: s=s.replace(a,b)
            s=s.replace('b8vipvip/GPTWork','b8vipvip/GPTLock')
            if s!=old: p.write_text(s,encoding='utf-8')

          renames={
            'packaging/windows/GPTLock.iss':'packaging/windows/GPTWork.iss',
            'packaging/windows/Install-GPTLock.ps1':'packaging/windows/Install-GPTWork.ps1',
            'packaging/windows/Repair-GPTLock.ps1':'packaging/windows/Repair-GPTWork.ps1',
            'packaging/windows/Update-GPTLock.ps1':'packaging/windows/Update-GPTWork.ps1',
            'packaging/linux/gptlock-core.deb.service':'packaging/linux/gptwork-core.deb.service',
            'packaging/linux/gptlock-core.service':'packaging/linux/gptwork-core.service',
          }
          for old,new in renames.items():
            if Path(old).exists(): subprocess.run(['git','mv',old,new],check=True)

          # Native data directory/env migration: new installs are GPTWork; existing state stays intact.
          p=Path('native-core/src/config.rs'); s=p.read_text()
          s,n=re.subn(r'    pub fn discover\(\) -> Result<Self> \{.*?\n    \}\n\n    pub fn at', '''    pub fn discover() -> Result<Self> {
        for variable in ["GPTWORK_HOME", "GPTLOCK_HOME"] {
            if let Some(override_root) = env::var_os(variable) {
                if override_root.is_empty() { bail!("{variable} is empty"); }
                return Ok(Self::at(PathBuf::from(override_root)));
            }
        }
        let home = if cfg!(windows) {
            env::var_os("USERPROFILE").or_else(|| env::var_os("HOME"))
        } else { env::var_os("HOME") }
        .context("cannot determine the current user's home directory")?;
        let home = PathBuf::from(home);
        let preferred = home.join(".gptwork");
        let legacy = home.join(".gptlock");
        Ok(Self::at(if preferred.exists() || !legacy.exists() { preferred } else { legacy }))
    }

    pub fn at''',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ConfigStore::discover migration failed')
          p.write_text(s)

          # Private engine canonical executable/env names with legacy fallback.
          p=Path('native-core/src/private_engine.rs'); s=p.read_text()
          s=s.replace('const PRIVATE_ENGINE_ENV: &str = "GPTLOCK_PRIVATE_ENGINE";', 'const PRIVATE_ENGINE_ENV: &str = "GPTWORK_PRIVATE_ENGINE";\nconst LEGACY_PRIVATE_ENGINE_ENV: &str = "GPTLOCK_PRIVATE_ENGINE";')
          s,n=re.subn(r'fn executable_name\(\) -> .*?\nfn usable_file', '''fn executable_name() -> &'static str {
    if cfg!(windows) { "gptwork-engine.exe" } else { "gptwork-engine" }
}
fn legacy_executable_name() -> &'static str {
    if cfg!(windows) { "gptlock-engine.exe" } else { "gptlock-engine" }
}
fn default_engine_path() -> Result<PathBuf> {
    let current = env::current_exe().context("resolve current executable")?;
    let directory = current.parent().context("resolve executable directory")?;
    let preferred = directory.join(executable_name());
    let legacy = directory.join(legacy_executable_name());
    Ok(if preferred.is_file() || !legacy.is_file() { preferred } else { legacy })
}
pub fn configured_path() -> Result<PathBuf> {
    for variable in [PRIVATE_ENGINE_ENV, LEGACY_PRIVATE_ENGINE_ENV] {
        if let Some(value) = env::var_os(variable) {
            let path = PathBuf::from(value);
            if path.as_os_str().is_empty() { anyhow::bail!("{variable} is empty"); }
            return Ok(path);
        }
    }
    default_engine_path()
}

fn usable_file''',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('private engine migration failed')
          p.write_text(s)

          # Windows installer: stable AppId remains; stop legacy processes on first rename upgrade.
          p=Path('packaging/windows/GPTWork.iss'); s=p.read_text()
          s=s.replace('  CorePath: String;\n  EnginePath: String;', '  CorePath: String;\n  EnginePath: String;\n  LegacyCorePath: String;\n  LegacyEnginePath: String;')
          s=s.replace("  EnginePath := PowerShellSingleQuote(ExpandConstant('{app}\\bin\\gptwork-engine.exe'));", "  EnginePath := PowerShellSingleQuote(ExpandConstant('{app}\\bin\\gptwork-engine.exe'));\n  LegacyCorePath := PowerShellSingleQuote(ExpandConstant('{app}\\bin\\gptlock-core.exe'));\n  LegacyEnginePath := PowerShellSingleQuote(ExpandConstant('{app}\\bin\\gptlock-engine.exe'));")
          s=s.replace("'$targets=@([IO.Path]::GetFullPath(''' + CorePath + '''),[IO.Path]::GetFullPath(''' + EnginePath + ''')); ' +", "'$targets=@([IO.Path]::GetFullPath(''' + CorePath + '''),[IO.Path]::GetFullPath(''' + EnginePath + '''),[IO.Path]::GetFullPath(''' + LegacyCorePath + '''),[IO.Path]::GetFullPath(''' + LegacyEnginePath + ''')); ' +")
          s=s.replace("Get-Process -Name ''gptwork-core'',''gptwork-engine'' -ErrorAction", "Get-Process -Name ''gptwork-core'',''gptwork-engine'',''gptlock-core'',''gptlock-engine'' -ErrorAction")
          s=s.replace("     FileExists(ExpandConstant('{app}\\bin\\gptwork-engine.exe')) then", "     FileExists(ExpandConstant('{app}\\bin\\gptwork-engine.exe')) or\n     FileExists(ExpandConstant('{app}\\bin\\gptlock-core.exe')) or\n     FileExists(ExpandConstant('{app}\\bin\\gptlock-engine.exe')) then")
          anchor='Type: filesandordirs; Name: "{app}\\extension"\n'
          s=s.replace(anchor,anchor+'Type: files; Name: "{app}\\bin\\gptlock-core.exe"\nType: files; Name: "{app}\\bin\\gptlock-engine.exe"\nType: files; Name: "{app}\\tools\\Update-GPTLock.ps1"\nType: files; Name: "{app}\\tools\\Repair-GPTLock.ps1"\n',1)
          p.write_text(s)

          # New update coordinator also recognizes a legacy running core during first upgrade.
          p=Path('native-core/src/updater.rs'); s=p.read_text()
          s=s.replace("Get-Process -Name 'gptwork-core' -ErrorAction SilentlyContinue", "Get-Process -Name 'gptwork-core','gptlock-core' -ErrorAction SilentlyContinue")
          p.write_text(s)

          # Debian package id intentionally remains gptlock for dpkg upgrade continuity; payload is GPTWork.
          p=Path('packaging/linux/build-deb.sh'); s=p.read_text()
          s=s.replace('$package_root/usr/share/gptlock/extension','$package_root/usr/share/gptwork/extension')
          s=s.replace('install -m 0755 "$script_dir/update.sh" "$package_root/usr/bin/gptwork-update"\n', 'install -m 0755 "$script_dir/update.sh" "$package_root/usr/bin/gptwork-update"\nln -s gptwork-core "$package_root/usr/bin/gptlock-core"\nif [[ -n "$private_engine_path" ]]; then ln -s gptwork-engine "$package_root/usr/bin/gptlock-engine"; fi\nln -s gptwork-update "$package_root/usr/bin/gptlock-update"\n')
          s=s.replace('install -m 0644 "$script_dir/gptwork-core.deb.service" "$package_root/usr/lib/systemd/user/gptwork-core.service"\n','install -m 0644 "$script_dir/gptwork-core.deb.service" "$package_root/usr/lib/systemd/user/gptwork-core.service"\nln -s gptwork-core.service "$package_root/usr/lib/systemd/user/gptlock-core.service"\n')
          s=s.replace('while IFS= read -r file; do\n','ln -s gptwork "$package_root/usr/share/gptlock"\nwhile IFS= read -r file; do\n',1)
          s=s.replace('output="$output_dir/gptlock_${version}_${architecture}.deb"','output="$output_dir/gptwork_${version}_${architecture}.deb"')
          p.write_text(s)

          # Manual Linux installer selects canonical root for new installs and reuses legacy root in place.
          p=Path('packaging/linux/install.sh'); s=p.read_text()
          s=s.replace('install_dir="$data_home/gptlock/bin"\ninstalled_binary="$install_dir/gptwork-core"\ninstalled_updater="$install_dir/gptwork-update"\ninstalled_extension="$data_home/gptlock/extension"', 'preferred_root="$data_home/gptwork"\nlegacy_root="$data_home/gptlock"\nif [[ -d "$legacy_root" && ! -e "$preferred_root" ]]; then product_root="$legacy_root"; else product_root="$preferred_root"; fi\ninstall_dir="$product_root/bin"\ninstalled_binary="$install_dir/gptwork-core"\ninstalled_updater="$install_dir/gptwork-update"\ninstalled_extension="$product_root/extension"')
          s=s.replace('install -m 0755 "$script_dir/update.sh" "$installed_updater"\n','install -m 0755 "$script_dir/update.sh" "$installed_updater"\nln -sfn gptwork-core "$install_dir/gptlock-core"\nln -sfn gptwork-update "$install_dir/gptlock-update"\n')
          s=s.replace('cat >"$systemd_dir/gptwork-core.service" <<EOF','systemctl --user stop gptlock-core.service 2>/dev/null || true\ncat >"$systemd_dir/gptwork-core.service" <<EOF')
          s=s.replace('EOF\n\nif command -v systemctl >/dev/null 2>&1; then\n','EOF\nln -sfn gptwork-core.service "$systemd_dir/gptlock-core.service"\n\nif command -v systemctl >/dev/null 2>&1; then\n',1)
          p.write_text(s)
          p=Path('packaging/linux/gptwork-core.service'); p.write_text(p.read_text().replace('/.local/share/gptlock/','/.local/share/gptwork/'))

          # Linux updater prefers GPTWork asset and canonical service, with transition fallback.
          p=Path('packaging/linux/update.sh'); s=p.read_text()
          s=s.replace('preferred = f"gptlock_{version}_amd64.deb"\nif preferred in assets:\n    name = preferred\nelse:\n    candidates = sorted(name for name in assets if name.startswith("gptlock_") and name.endswith("_amd64.deb"))','preferred = f"gptwork_{version}_amd64.deb"\nlegacy = f"gptlock_{version}_amd64.deb"\nif preferred in assets:\n    name = preferred\nelif legacy in assets:\n    name = legacy\nelse:\n    candidates = sorted(name for name in assets if (name.startswith("gptwork_") or name.startswith("gptlock_")) and name.endswith("_amd64.deb"))')
          s=s.replace('systemctl --user try-restart gptwork-core.service 2>/dev/null || true','systemctl --user try-restart gptwork-core.service 2>/dev/null || systemctl --user try-restart gptlock-core.service 2>/dev/null || true')
          p.write_text(s)

          # Windows update parser uses canonical name but accepts transition alias.
          p=Path('extension/update-manager.js'); s=p.read_text()
          s=s.replace("export const WINDOWS_INSTALLER_NAME = 'GPTWorkSetup-x64.exe';", "export const WINDOWS_INSTALLER_NAME = 'GPTWorkSetup-x64.exe';\nexport const LEGACY_WINDOWS_INSTALLER_NAME = 'GPTLockSetup-x64.exe';")
          s=s.replace("? release.assets.find((asset) => asset?.name === WINDOWS_INSTALLER_NAME)\n    : null;", "? (release.assets.find((asset) => asset?.name === WINDOWS_INSTALLER_NAME)\n      || release.assets.find((asset) => asset?.name === LEGACY_WINDOWS_INSTALLER_NAME))\n    : null;")
          p.write_text(s)

          # Public site hides legacy transition assets if their GPTWork equivalent is present.
          p=Path('license-server/public/site.js'); s=p.read_text()
          helper="""function canonicalAssetForLegacy(name) {
            const value = String(name || '');
            if (value === 'GPTLockSetup-x64.exe') return 'GPTWorkSetup-x64.exe';
            if (value.startsWith('gptlock-extension-')) return value.replace('gptlock-extension-', 'gptwork-extension-');
            if (value.startsWith('gptlock-core-')) return value.replace('gptlock-core-', 'gptwork-core-');
            if (value.startsWith('gptlock_')) return value.replace('gptlock_', 'gptwork_');
            return '';
          }

"""
          s=s.replace('async function loadReleaseFeed() {\n',helper+'async function loadReleaseFeed() {\n',1)
          s=s.replace("    const assets = node('div', 'asset-row');\n    for (const asset of release.assets || []) {", "    const assets = node('div', 'asset-row');\n    const releaseAssets = release.assets || [];\n    const releaseAssetNames = new Set(releaseAssets.map((asset) => String(asset?.name || '')));\n    for (const asset of releaseAssets) {\n      const canonical = canonicalAssetForLegacy(asset?.name);\n      if (canonical && releaseAssetNames.has(canonical)) continue;")
          p.write_text(s)

          Path('docs/GPTWORK_MIGRATION.md').write_text('''# GPTWork 品牌迁移 / GPTWork Brand Migration

产品、扩展、网站、安装器、可执行文件和发布资产的正式名称统一为 **GPTWork**。

为了保证现有用户无损升级，GitHub 实际仓库路径 `b8vipvip/GPTLock`、线上域名 `gptlock.mv3.cn`、Native Messaging Host ID `com.gptlock.core`、`GPTLOCK_*` 环境变量、既有 storage/Cookie/数据库键、`.gptlock` 历史数据目录以及设备 ID/加密派生标签暂时作为兼容协议保留。它们不再属于用户可见产品名称，不能直接全量替换，否则会导致更新链、登录状态、设备身份或加密数据失效。

新安装优先使用 GPTWork 命名；旧安装自动复用原数据和兼容入口。过渡发布同时附带旧下载文件名别名，旧版更新器仍可升级；新界面只展示 GPTWork 正式资产。
''')

          Path('extension/tests/gptwork-brand.test.mjs').write_text('''import assert from 'node:assert/strict';
import fs from 'node:fs';
import path from 'node:path';
import test from 'node:test';
import { fileURLToPath } from 'node:url';
const here=path.dirname(fileURLToPath(import.meta.url));
const repo=path.resolve(here,'..','..');
const read=(p)=>fs.readFileSync(path.join(repo,p),'utf8');
test('GPTWork is canonical product metadata',()=>{
  const manifest=JSON.parse(read('extension/manifest.json'));
  assert.equal(manifest.name,'GPTWork');
  assert.equal(manifest.action.default_title,'GPTWork');
  assert.equal(JSON.parse(read('extension/package.json')).name,'gptwork-extension');
  assert.match(read('native-core/Cargo.toml'),/name = "gptwork-core"/);
  assert.match(read('private-engine/Cargo.toml'),/name = "gptwork-private-engine"/);
  assert.match(read('packaging/windows/GPTWork.iss'),/OutputBaseFilename=GPTWorkSetup-x64/);
});
test('user-facing HTML/CSS no longer exposes legacy product brand',()=>{
  for(const rootName of ['extension','license-server/public']){
    const walk=(dir)=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const f=path.join(dir,e.name);if(e.isDirectory())walk(f);else if(/\\.(?:html|css)$/.test(e.name)){const s=fs.readFileSync(f,'utf8');assert.doesNotMatch(s,/GPTLock|(?<![A-Za-z0-9_])GPTLOCK(?![A-Za-z0-9_-])/,path.relative(repo,f));}}};
    walk(path.join(repo,rootName));
  }
});
test('compatibility contracts remain available during rename transition',()=>{
  assert.match(read('extension/update-manager.js'),/LEGACY_WINDOWS_INSTALLER_NAME = 'GPTLockSetup-x64\\.exe'/);
  assert.match(read('extension/manifest.json'),/https:\/\/gptlock\\.mv3\\.cn\/\*/);
  assert.match(read('native-core/src/lib.rs'),/com\\.gptlock\\.core/);
});
''')
          PY
          cargo generate-lockfile --manifest-path native-core/Cargo.toml
          git diff --check
      - name: Run source regression suites
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd extension && npm test)
          (cd license-server && npm test)
          cargo fmt --manifest-path native-core/Cargo.toml -- --check
          cargo test --locked --manifest-path native-core/Cargo.toml
          cargo fmt --manifest-path private-engine/Cargo.toml -- --check
          cargo test --manifest-path private-engine/Cargo.toml
          bash -n packaging/linux/install.sh packaging/linux/update.sh packaging/linux/build-deb.sh
          pwsh -NoProfile -NonInteractive -Command "[void][ScriptBlock]::Create((Get-Content -LiteralPath 'packaging/windows/Install-GPTWork.ps1' -Raw)); [void][ScriptBlock]::Create((Get-Content -LiteralPath 'packaging/windows/Repair-GPTWork.ps1' -Raw)); [void][ScriptBlock]::Create((Get-Content -LiteralPath 'packaging/windows/Update-GPTWork.ps1' -Raw))"
      - name: Commit transformed sources
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'refactor: rename product sources to GPTWork with compatibility'
          git push origin HEAD:refactor/gptwork-unified-brand-20260903
