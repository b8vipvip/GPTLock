name: Temporary GPTWork Source Migration

on:
  push:
    branches:
      - refactor/gptwork-unified-brand-20260903

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration-safe source rename
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tmp-gptwork-migrate.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('extension/tests/gptwork-brand.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "          assert.doesNotMatch(fs.readFileSync(file, 'utf8'), /GPTLock|(?<![A-Za-z0-9_])GPTLOCK(?![A-Za-z0-9_-])/, path.relative(repo, file));"
          new = "          const source = fs.readFileSync(file, 'utf8').replaceAll('https://github.com/b8vipvip/GPTLock', 'https://github.com/b8vipvip/REPOSITORY');\n          assert.doesNotMatch(source, /GPTLock|(?<![A-Za-z0-9_])GPTLOCK(?![A-Za-z0-9_-])/, path.relative(repo, file));"
          if old not in text:
              raise SystemExit('GPTWork brand test patch anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo generate-lockfile --manifest-path native-core/Cargo.toml
          cargo fmt --manifest-path native-core/Cargo.toml
          cargo fmt --manifest-path private-engine/Cargo.toml
          git diff --check
      - name: Run full rename regression suites
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd extension && npm test)
          (cd license-server && npm test)
          cargo fmt --manifest-path native-core/Cargo.toml -- --check
          cargo test --locked --manifest-path native-core/Cargo.toml
          cargo fmt --manifest-path private-engine/Cargo.toml -- --check
          cargo test --manifest-path private-engine/Cargo.toml
          bash -n packaging/linux/install.sh packaging/linux/update.sh packaging/linux/build-deb.sh
          pwsh -NoProfile -NonInteractive -Command "[void][ScriptBlock]::Create((Get-Content -LiteralPath 'packaging/windows/Install-GPTWork.ps1' -Raw)); [void][ScriptBlock]::Create((Get-Content -LiteralPath 'packaging/windows/Repair-GPTWork.ps1' -Raw)); [void][ScriptBlock]::Create((Get-Content -LiteralPath 'packaging/windows/Update-GPTWork.ps1' -Raw))"
      - name: Commit transformed project sources
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf generated-workflows
          rm -f tools/tmp-gptwork-migrate.py tools/tmp-gptwork-workflows.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: rename product to GPTWork with upgrade compatibility'
          git push origin HEAD:refactor/gptwork-unified-brand-20260903
