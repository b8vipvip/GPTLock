name: Apply trusted model discovery patch

on:
  push:
    branches:
      - fix/trusted-model-discovery
    paths:
      - .github/workflows/trusted-model-discovery-patch.yml
      - .github/trusted-model-discovery-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trusted-model-discovery
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/trusted-model-discovery-patch.py
      - name: Run extension tests
        working-directory: extension
        run: npm test
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/model-catalog.js extension/model-catalog-options.js extension/page-model-evidence.js extension/options.html extension/tests/model-discovery.test.mjs
          git diff --cached --exit-code && { echo 'Patch produced no changes'; exit 1; } || true
          git commit -m 'fix: trust network evidence for model discovery'
          git push origin HEAD:fix/trusted-model-discovery
