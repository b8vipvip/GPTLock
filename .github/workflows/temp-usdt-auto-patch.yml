name: Temporary USDT integration patcher

on:
  push:
    branches:
      - feat/usdt-okx-auto-settlement-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/usdt-okx-auto-settlement-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply correctness patches
        shell: python
        run: |
          from pathlib import Path

          changed = False

          def patch(path, old, new, marker):
              global changed
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected snippet not found in {path}: {marker}')
              p.write_text(text.replace(old, new, 1))
              changed = True

          patch(
              'license-server/payment-system.mjs',
              """    db.exec(`\n      CREATE TABLE IF NOT EXISTS secure_settings (""",
              """    db.exec(`\n      CREATE TABLE IF NOT EXISTS app_settings (\n        key TEXT PRIMARY KEY,\n        value TEXT NOT NULL,\n        updated_at TEXT NOT NULL\n      ) STRICT;\n      CREATE TABLE IF NOT EXISTS secure_settings (""",
              'CREATE TABLE IF NOT EXISTS app_settings (\n        key TEXT PRIMARY KEY,\n        value TEXT NOT NULL,'
          )

          patch(
              'license-server/payment-system.mjs',
              """    const price = quote || usdtQuote(order.plan_code);\n    const details = method('usdt');\n    const now = nowIso();\n    db.prepare(`INSERT INTO usdt_order_payments(order_id,expected_amount_micros,asset,network,address,memo,updated_at)\n      VALUES(?,?,?,?,?,?,?)`).run(order.id, price.amountMicros, 'USDT', details?.crypto_network || '', details?.crypto_address || '', details?.crypto_memo || '', now);""",
              """    const price = quote || usdtQuote(order.plan_code);\n    const baseAmountMicros = Number(price.amountMicros);\n    const reserved = new Set(db.prepare(`SELECT d.expected_amount_micros FROM usdt_order_payments d\n      JOIN membership_orders o ON o.id=d.order_id\n      WHERE o.status='pending' AND o.payment_method='usdt' AND o.id<>?`).all(order.id).map((row) => Number(row.expected_amount_micros)));\n    let expectedAmountMicros = null;\n    for (let offset = 0; offset <= 999; offset += 1) {\n      const candidate = baseAmountMicros + offset;\n      if (!reserved.has(candidate)) { expectedAmountMicros = candidate; break; }\n    }\n    if (!expectedAmountMicros) throw Object.assign(new Error('当前待支付 USDT 订单过多，暂时无法分配唯一付款金额，请稍后重试'), { status: 409, code: 'USDT_AMOUNT_POOL_EXHAUSTED' });\n    const details = method('usdt');\n    const now = nowIso();\n    db.prepare(`INSERT INTO usdt_order_payments(order_id,expected_amount_micros,asset,network,address,memo,updated_at)\n      VALUES(?,?,?,?,?,?,?)`).run(order.id, expectedAmountMicros, 'USDT', details?.crypto_network || '', details?.crypto_address || '', details?.crypto_memo || '', now);""",
              'USDT_AMOUNT_POOL_EXHAUSTED'
          )

          patch(
              'license-server/payment-system.mjs',
              """      const usedTxIds = new Set(db.prepare(\"SELECT okx_tx_id FROM usdt_order_payments WHERE okx_tx_id<>''\").all().map((row) => row.okx_tx_id));\n      let settled = 0;""",
              """      const usedTxIds = new Set(db.prepare(\"SELECT okx_tx_id FROM usdt_order_payments WHERE okx_tx_id<>''\").all().map((row) => row.okx_tx_id));\n      const activeOrderIds = new Set(orders.map((row) => row.order_id));\n      let settled = 0;""",
              'const activeOrderIds = new Set(orders.map((row) => row.order_id));'
          )
          patch(
              'license-server/payment-system.mjs',
              "const candidates = orders.filter((row) => depositMatchesOrder(deposit, row, config));",
              "const candidates = orders.filter((row) => activeOrderIds.has(row.order_id) && depositMatchesOrder(deposit, row, config));",
              'activeOrderIds.has(row.order_id) && depositMatchesOrder'
          )
          patch(
              'license-server/payment-system.mjs',
              """          status.lastMatchedOrderId = candidate.order_id;\n          settled += 1;""",
              """          status.lastMatchedOrderId = candidate.order_id;\n          activeOrderIds.delete(candidate.order_id);\n          settled += 1;""",
              'activeOrderIds.delete(candidate.order_id);'
          )

          patch(
              'license-server/account-system.mjs',
              "function markOrderPaid(row) {",
              "function markOrderPaid(row, { allowExpiredPending = false } = {}) {",
              'function markOrderPaid(row, { allowExpiredPending = false } = {}) {'
          )
          patch(
              'license-server/account-system.mjs',
              "if (Date.parse(row.expires_at) <= Date.now()) {",
              "if (!allowExpiredPending && Date.parse(row.expires_at) <= Date.now()) {",
              '!allowExpiredPending && Date.parse(row.expires_at) <= Date.now()'
          )
          patch(
              'license-server/account-system.mjs',
              "const paid = markOrderPaid(db.prepare('SELECT * FROM membership_orders WHERE id=?').get(Number(orderId)));",
              "const paid = markOrderPaid(db.prepare('SELECT * FROM membership_orders WHERE id=?').get(Number(orderId)), { allowExpiredPending: context?.source === 'okx_auto' });",
              "allowExpiredPending: context?.source === 'okx_auto'"
          )

          for path in ['license-server/account-system.mjs', 'license-server/site-account.mjs']:
              p = Path(path)
              text = p.read_text()
              old = "if (order.status === 'pending' && Date.parse(order.expires_at) <= Date.now()) {"
              new = "if (order.status === 'pending' && order.payment_method !== 'usdt' && Date.parse(order.expires_at) <= Date.now()) {"
              if new not in text and old in text:
                  p.write_text(text.replace(old, new))
                  changed = True

          p = Path('license-server/package.json')
          text = p.read_text()
          if 'node --check okx-client.mjs' not in text:
              old = 'node --check server.mjs && node --check account-system.mjs'
              if old not in text:
                  raise SystemExit('package check script anchor not found')
              p.write_text(text.replace(old, 'node --check server.mjs && node --check okx-client.mjs && node --check account-system.mjs', 1))
              changed = True

          if changed:
              Path('/tmp/usdt-patch-changed').write_text('1')
      - name: Commit correctness patches
        shell: bash
        run: |
          if [ ! -f /tmp/usdt-patch-changed ]; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add license-server/payment-system.mjs license-server/account-system.mjs license-server/site-account.mjs license-server/package.json
          git commit -m 'fix: harden USDT automatic settlement matching'
          git push origin HEAD:feat/usdt-okx-auto-settlement-20260903
