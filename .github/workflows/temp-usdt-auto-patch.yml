name: Temporary USDT integration patcher

on:
  push:
    branches:
      - feat/usdt-okx-auto-settlement-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/usdt-okx-auto-settlement-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final correctness patches
        shell: python
        run: |
          from pathlib import Path

          changed = False

          def replace_required(path, old, new):
              global changed
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected snippet not found in {path}')
              p.write_text(text.replace(old, new, 1))
              changed = True

          # Undo an earlier broad replacement that accidentally touched session expiry.
          p = Path('license-server/account-system.mjs')
          text = p.read_text()
          bad_session = "if (!allowExpiredPending && Date.parse(row.expires_at) <= Date.now()) {\n      db.prepare('UPDATE user_sessions SET revoked_at=? WHERE id=?').run(nowIso(), row.id);"
          good_session = "if (Date.parse(row.expires_at) <= Date.now()) {\n      db.prepare('UPDATE user_sessions SET revoked_at=? WHERE id=?').run(nowIso(), row.id);"
          if bad_session in text:
              text = text.replace(bad_session, good_session, 1)
              p.write_text(text)
              changed = True

          replace_required(
              'license-server/account-system.mjs',
              """  function markOrderPaid(row, { allowExpiredPending = false } = {}) {\n    if (!row) fail(404, 'ORDER_NOT_FOUND', '订单不存在');\n    if (row.status === 'paid') return row;\n    if (row.status !== 'pending') fail(409, 'ORDER_NOT_PENDING', '订单当前状态无法确认付款');\n    if (Date.parse(row.expires_at) <= Date.now()) {""",
              """  function markOrderPaid(row, { allowExpiredPending = false } = {}) {\n    if (!row) fail(404, 'ORDER_NOT_FOUND', '订单不存在');\n    if (row.status === 'paid') return row;\n    if (row.status !== 'pending') fail(409, 'ORDER_NOT_PENDING', '订单当前状态无法确认付款');\n    if (!allowExpiredPending && Date.parse(row.expires_at) <= Date.now()) {"""
          )

          replace_required(
              'license-server/payment-system.mjs',
              """      WHERE o.status='pending' AND o.payment_method='usdt' AND o.id<>?`).all(order.id).map((row) => Number(row.expected_amount_micros)));""",
              """      WHERE o.status='pending' AND o.payment_method='usdt' AND o.id<>? AND o.expires_at>=?`).all(order.id, order.created_at).map((row) => Number(row.expected_amount_micros)));"""
          )

          p = Path('license-server/payment-system.mjs')
          text = p.read_text()
          if 'let startupTimer = null;' not in text:
              text = text.replace('  let pollTimer = null;\n  let checking = false;', '  let pollTimer = null;\n  let startupTimer = null;\n  let checking = false;', 1)
              changed = True
          old_stop = """  function stopPoller() {\n    if (pollTimer) clearInterval(pollTimer);\n    pollTimer = null;\n  }"""
          new_stop = """  function stopPoller() {\n    if (pollTimer) clearInterval(pollTimer);\n    if (startupTimer) clearTimeout(startupTimer);\n    pollTimer = null;\n    startupTimer = null;\n  }"""
          if new_stop not in text:
              if old_stop not in text: raise SystemExit('stopPoller anchor missing')
              text = text.replace(old_stop, new_stop, 1)
              changed = True
          old_start = "setTimeout(() => void runAutoSettlement().catch(() => {}), 1000).unref?.();"
          new_start = "startupTimer = setTimeout(() => void runAutoSettlement().catch(() => {}), 1000);\n    startupTimer.unref?.();"
          if new_start not in text:
              if old_start not in text: raise SystemExit('startup timer anchor missing')
              text = text.replace(old_start, new_start, 1)
              changed = True
          p.write_text(text)

          # Keep USDT pending beyond the payment deadline so a payment made inside
          # the deadline can still become state=2 after confirmations complete.
          for path in ['license-server/account-system.mjs', 'license-server/site-account.mjs']:
              p = Path(path)
              text = p.read_text()
              old = "if (order.status === 'pending' && Date.parse(order.expires_at) <= Date.now()) {"
              new = "if (order.status === 'pending' && order.payment_method !== 'usdt' && Date.parse(order.expires_at) <= Date.now()) {"
              if new not in text and old in text:
                  p.write_text(text.replace(old, new))
                  changed = True

          if changed:
              Path('/tmp/usdt-patch-changed').write_text('1')
      - name: Commit final correctness patches
        shell: bash
        run: |
          if [ ! -f /tmp/usdt-patch-changed ]; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add license-server/account-system.mjs license-server/site-account.mjs license-server/payment-system.mjs
          git commit -m 'fix: preserve session expiry and finalize USDT matching'
          git push origin HEAD:feat/usdt-okx-auto-settlement-20260903
