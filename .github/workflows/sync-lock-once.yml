name: Sync Cargo lock once

on:
  push:
    branches:
      - fix/live-model-indicator-v042
    paths:
      - native-core/Cargo.toml
      - .github/workflows/sync-lock-once.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-model-indicator-v042
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile --manifest-path native-core/Cargo.toml
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-core/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git commit -m "chore: sync Cargo.lock for 0.4.2"
          git push origin HEAD:fix/live-model-indicator-v042
