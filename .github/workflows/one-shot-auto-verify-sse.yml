name: One-shot GPTLock 0.3.6 patch

on:
  push:
    branches:
      - fix/auto-verify-sse-capture

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source patches
        run: python .github/scripts/apply_gptlock_036.py
      - name: Validate patched extension
        working-directory: extension
        run: npm test
      - name: Validate versions and JSON
        run: |
          python -m json.tool extension/manifest.json >/dev/null
          python - <<'PY'
          import json
          import tomllib
          with open('extension/manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)['version']
          with open('extension/package.json', encoding='utf-8') as handle:
              package = json.load(handle)['version']
          with open('native-core/Cargo.toml', 'rb') as handle:
              cargo = tomllib.load(handle)['package']['version']
          assert manifest == package == cargo == '0.3.6', (manifest, package, cargo)
          lock = open('native-core/Cargo.lock', encoding='utf-8').read()
          assert 'name = "gptlock-core"\nversion = "0.3.6"' in lock
          PY
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'GPTLock 0.3.6: preserve auto-verify state and capture raw SSE diagnostics'
          git push origin HEAD:fix/auto-verify-sse-capture
