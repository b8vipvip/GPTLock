name: Finalize Windows updater v0.5.20

on:
  push:
    branches:
      - fix/windows-update-host-lifetime-v0520

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-update-host-lifetime-v0520
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic updater follow-up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updater = Path('native-core/src/updater.rs')
          text = updater.read_text(encoding='utf-8')
          start = text.index('    #[cfg(windows)]\n    #[test]\n    fn formats_silent_installer_command_line()')
          end = text.index('    #[cfg(windows)]\n    #[test]\n    fn unblock_verified_download_is_idempotent_without_motw()', start)
          replacement = (
              '    #[cfg(windows)]\n'
              '    #[test]\n'
              '    fn formats_silent_installer_command_line() {\n'
              '        let installer = Path::new(r"C:\\Users\\test\\Downloads\\GPTLockSetup-x64.exe");\n'
              '        let install_root = Path::new(r"C:\\Users\\test\\AppData\\Local\\GPTLock");\n'
              '        let installer_log = install_root.join(UPDATE_INSTALLER_LOG_NAME);\n'
              '        let command = windows_command_line(installer, install_root, &installer_log).unwrap();\n'
              '        assert!(command.starts_with("\\\"C:\\\\Users\\\\test\\\\Downloads\\\\GPTLockSetup-x64.exe\\\""));\n'
              '        assert!(command.contains("/VERYSILENT"));\n'
              '        assert!(command.contains("/DIR=\\\"C:\\\\Users\\\\test\\\\AppData\\\\Local\\\\GPTLock\\\""));\n'
              '        assert!(command.contains("update-installer.log"));\n'
              '    }\n\n'
          )
          updater.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          options = Path('extension/options-update.js')
          text = options.read_text(encoding='utf-8')
          old = "  appendLog(`校验通过 · 签名状态 ${prepared?.signatureStatus || 'Unknown'}`);\n\n  await setStatus('installing', 68, `正在后台安装 ${release.latestVersion}；Core 会短暂断开`, {\n    targetVersion: release.latestVersion,\n    installRoot: prepared?.installRoot ?? null,\n    helperLogPath: prepared?.helperLogPath ?? null,\n  });"
          new = "  appendLog(`校验通过 · 签名状态 ${prepared?.signatureStatus || 'Unknown'} · 启动方式 ${prepared?.launcherStrategy || 'legacy'}`);\n  logUpdate('info', 'installer_launch_prepared', {\n    targetVersion: release.latestVersion,\n    launcherStrategy: prepared?.launcherStrategy ?? null,\n    launcherProcessId: prepared?.launcherProcessId ?? null,\n    helperLogPath: prepared?.helperLogPath ?? null,\n    installerLogPath: prepared?.installerLogPath ?? null,\n  });\n\n  await setStatus('installing', 68, `正在后台安装 ${release.latestVersion}；Core 会短暂断开`, {\n    targetVersion: release.latestVersion,\n    installRoot: prepared?.installRoot ?? null,\n    helperLogPath: prepared?.helperLogPath ?? null,\n    installerLogPath: prepared?.installerLogPath ?? null,\n    launcherStrategy: prepared?.launcherStrategy ?? null,\n    launcherProcessId: prepared?.launcherProcessId ?? null,\n  });"
          if old not in text:
              raise SystemExit('options-update target block not found')
          options.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path native-core/Cargo.toml
      - name: Refresh Cargo lockfile
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Run extension and server tests
        run: npm test --prefix extension
      - name: Run Rust tests
        run: cargo test --manifest-path native-core/Cargo.toml
      - name: Verify locked Rust build
        run: cargo check --locked --manifest-path native-core/Cargo.toml
      - name: Check whitespace
        run: git diff --check
      - name: Remove temporary workflow and commit finalized files
        run: |
          rm -f .github/workflows/finalize-updater-v0520.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/src/updater.rs native-core/Cargo.lock extension/options-update.js .github/workflows/finalize-updater-v0520.yml
          if git diff --cached --quiet; then
            echo 'No finalization changes.'
            exit 0
          fi
          git commit -m 'fix: finalize detached Windows updater lifecycle'
          git push origin HEAD:fix/windows-update-host-lifetime-v0520
