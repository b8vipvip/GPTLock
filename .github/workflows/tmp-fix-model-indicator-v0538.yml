name: Temporary model indicator v0.5.38 patch

on:
  push:
    branches:
      - fix/model-indicator-single-writer-v0538-20260903
    paths:
      - .github/workflows/tmp-fix-model-indicator-v0538.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-indicator-single-writer-v0538-20260903
          fetch-depth: 0
      - name: Apply targeted fix and bump v0.5.38
        run: python3 .github/tmp_fix_model_indicator_v0538.py
      - name: Commit final patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/model-catalog.js extension/tests/model-indicator.test.mjs extension/tests/model-status-continuity-runtime.test.mjs extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock
          git rm .github/workflows/tmp-fix-model-indicator-v0538.yml .github/tmp_fix_model_indicator_v0538.py
          git commit -m "fix: eliminate floating model indicator writer race"
          git push origin HEAD:fix/model-indicator-single-writer-v0538-20260903
