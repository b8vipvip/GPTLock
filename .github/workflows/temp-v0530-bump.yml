name: Temporary v0.5.30 bump

on:
  push:
    branches:
      - fix/release-mirror-bootstrap-v0530

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump-v0530]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-mirror-bootstrap-v0530
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump product version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old = '0.5.29'
          new = '0.5.30'

          for path in [Path('extension/manifest.json'), Path('extension/package.json')]:
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['version'] == old, (path, data.get('version'))
              data['version'] = new
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo = Path('native-core/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          needle = f'version = "{old}"'
          assert text.count(needle) == 1
          cargo.write_text(text.replace(needle, f'version = "{new}"', 1), encoding='utf-8')

          lock = Path('native-core/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          needle = f'name = "gptlock-core"\nversion = "{old}"'
          assert text.count(needle) == 1
          lock.write_text(text.replace(needle, f'name = "gptlock-core"\nversion = "{new}"', 1), encoding='utf-8')
          PY
      - name: Validate locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 --manifest-path native-core/Cargo.toml >/dev/null
      - name: Validate product version consistency
        run: |
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          target = '0.5.30'
          assert json.loads(Path('extension/manifest.json').read_text())['version'] == target
          assert json.loads(Path('extension/package.json').read_text())['version'] == target
          with open('native-core/Cargo.toml', 'rb') as f:
              assert tomllib.load(f)['package']['version'] == target
          text = Path('native-core/Cargo.lock').read_text()
          assert f'name = "gptlock-core"\nversion = "{target}"' in text
          PY
      - name: Commit bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/manifest.json extension/package.json native-core/Cargo.toml native-core/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m 'release: v0.5.30 [skip-bump-v0530]'
          git push origin HEAD:fix/release-mirror-bootstrap-v0530
