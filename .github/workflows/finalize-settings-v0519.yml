name: Finalize settings v0.5.19

on:
  push:
    branches:
      - fix/settings-license-stale-runtime-v0519

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-license-stale-runtime-v0519
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Cargo lockfile
        run: cargo check --manifest-path native-core/Cargo.toml
      - name: Run extension and server tests
        run: npm test --prefix extension
      - name: Verify locked Rust build
        run: cargo check --locked --manifest-path native-core/Cargo.toml
      - name: Check whitespace
        run: git diff --check
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- native-core/Cargo.lock; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-core/Cargo.lock
          git commit -m 'chore: refresh Cargo.lock for 0.5.19'
          git push origin HEAD:fix/settings-license-stale-runtime-v0519
