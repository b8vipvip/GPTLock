name: temp-remove-legacy-context-remaining
on:
  push:
    branches:
      - refactor/remove-legacy-context-remaining-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-context-remaining-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Remove legacy context remaining chain
        shell: bash
        run: |
          set -Eeuo pipefail
          if test ! -f extension/private-context-indicator.js; then
            echo 'migration already applied'
            exit 0
          fi
          python .github/scripts/tmp_remove_legacy_context_remaining.py
          git rm extension/private-context-indicator.js extension/tests/private-context-indicator.test.mjs
          cargo fmt --manifest-path native-core/Cargo.toml --all
          cargo fmt --manifest-path private-engine/Cargo.toml --all
          cargo test --manifest-path private-engine/Cargo.toml --all-targets
          cargo test --manifest-path native-core/Cargo.toml --all-targets
          cd extension
          npm test
      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            extension/manifest.json \
            extension/package.json \
            extension/private-core-channel.js \
            extension/private-context-bridge.js \
            extension/tests/private-context-bridge.test.mjs \
            extension/tests/private-core-channel-capability.test.mjs \
            extension/tests/private-request-public-boundary.test.mjs \
            extension/tests/private-context-legacy-removal.test.mjs \
            native-core/src/private_engine.rs \
            private-engine/src/lib.rs \
            private-engine/src/main.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(context): remove legacy remaining chain'
          git push origin HEAD:refactor/remove-legacy-context-remaining-v1
