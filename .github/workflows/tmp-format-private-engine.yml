name: Temporary Private Engine Formatter

on:
  push:
    branches:
      - refactor/private-engine-monorepo-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-private-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/private-engine-monorepo-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format private engine
        run: cargo fmt --manifest-path private-engine/Cargo.toml --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- private-engine; then
            echo 'Private engine already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add private-engine
          git commit -m 'style(private): apply rustfmt [skip-private-format]'
          git push origin HEAD:refactor/private-engine-monorepo-v1
